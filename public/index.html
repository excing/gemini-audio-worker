<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>Gemini 2.5 Flash Native Audio Demo</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 20px; }
        button { padding: 10px 20px; font-size: 16px; margin: 5px; cursor: pointer; }
        #log { background: #f0f0f0; padding: 10px; height: 300px; overflow-y: auto; margin-top: 20px; border-radius: 5px;}
        .system { color: gray; }
        .user { color: blue; }
        .gemini { color: green; }
    </style>
</head>
<body>

    <h2>Gemini 2.5 Flash 语音实时对话</h2>
    
    <div>
        <!-- 替换为你自己部署的 Worker WebSocket 地址 -->
        <input type="text" id="wsUrl" value="wss://gemini-audio-worker.archer-zz.workers.dev/ws" style="width: 100%; padding: 8px; margin-bottom: 10px;" placeholder="wss://your-worker.workers.dev/ws">
    </div>
    
    <button id="btnConnect">1. 连接 Gemini</button>
    <button id="btnGrantMic">2. 授权麦克风</button>
    <button id="btnMic" disabled>3. 按住说话 (Push to Talk)</button>
    <div style="margin-top: 10px; display: flex; gap: 8px; align-items: center;">
        <input id="textInput" type="text" placeholder="输入文字后回车发送" style="flex: 1; padding: 8px;">
        <button id="btnSendText" disabled>发送文字</button>
    </div>

    <div id="log"></div>

    <script>
        const btnConnect = document.getElementById('btnConnect');
        const btnGrantMic = document.getElementById('btnGrantMic');
        const btnMic = document.getElementById('btnMic');
        const btnSendText = document.getElementById('btnSendText');
        const textInput = document.getElementById('textInput');
        const logDiv = document.getElementById('log');
        const wsUrlInput = document.getElementById('wsUrl');

        let ws = null;
        let audioContext = null;
        let mediaStream = null;
        let processor = null;
        let micPermissionGranted = false;
        
        // Gemini 返回的音频播放队列
        let audioQueue = [];
        let isPlaying = false;
        let playContext = null;
        let nextPlayTime = 0;

        function log(message, type = 'system') {
            const p = document.createElement('div');
            p.className = type;
            p.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(p);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        // ==========================================
        // 1. WebSocket 通信逻辑
        // ==========================================
        btnConnect.onclick = () => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.close();
                return;
            }

            const url = wsUrlInput.value.trim();
            ws = new WebSocket(url);

            ws.onopen = () => {
                log('已连接到 Worker (正在初始化 Gemini...)', 'system');
                btnConnect.textContent = '断开连接';
                ensurePlaybackReady();
                updateMicButtonState();
                updateTextButtonState();
            };

            ws.onmessage = async (event) => {
                // 读取 Blob 数据为 Text
                const text = event.data instanceof Blob ? await event.data.text() : event.data;
                let data;
                try {
                    data = JSON.parse(text);
                } catch (error) {
                    log(`收到非 JSON 消息: ${text.slice(0, 120)}`, 'system');
                    return;
                }

                if (data.workerStatus) {
                    const statusType = data.workerStatus.type === 'error' ? 'system' : 'gemini';
                    log(`Worker: ${data.workerStatus.message}`, statusType);
                    return;
                }

                handleGeminiMessage(data);
            };

            ws.onerror = () => {
                log('WebSocket 发生错误，请检查地址、Worker 日志和 Gemini API Key', 'system');
            };

            ws.onclose = (event) => {
                log(`连接已断开 code=${event.code} reason=${event.reason || '无'}`, 'system');
                btnConnect.textContent = '1. 连接 Gemini';
                btnMic.disabled = true;
                btnSendText.disabled = true;
            };
        };

        btnGrantMic.onclick = async () => {
            try {
                await ensureMicPermission();
                log('麦克风已授权', 'system');
                updateMicButtonState();
            } catch (error) {
                log(`麦克风授权失败: ${error.name || 'Error'} ${error.message || ''}`, 'system');
            }
        };

        btnSendText.onclick = sendTextMessage;
        textInput.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendTextMessage();
            }
        });

        function sendTextMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                log('请先连接 Gemini', 'system');
                return;
            }
            ensurePlaybackReady();

            const text = textInput.value.trim();
            if (!text) return;

            ws.send(JSON.stringify({
                realtimeInput: {
                    text: text
                }
            }));
            log(`你: ${text}`, 'user');
            textInput.value = '';
        }

        function updateTextButtonState() {
            btnSendText.disabled = !(ws && ws.readyState === WebSocket.OPEN);
        }

        function updateMicButtonState() {
            btnMic.disabled = !(ws && ws.readyState === WebSocket.OPEN && micPermissionGranted);
            updateTextButtonState();
        }

        function handleGeminiMessage(data) {
            const modelTurn = data?.serverContent?.modelTurn;
            if (!modelTurn) {
                if (data?.serverContent?.turnComplete) {
                    log('Gemini 回复结束', 'system');
                }
                return;
            }

            const parts = modelTurn.parts || [];
            for (const part of parts) {
                if (part.text) {
                    log(`Gemini: ${part.text}`, 'gemini');
                }

                const inlineData = part.inlineData || part.inline_data || part.audioData || part.audio_data;
                const nestedInlineData = inlineData?.inlineData || inlineData?.inline_data || inlineData?.audioData || inlineData?.audio_data;
                const audioData = inlineData?.data || nestedInlineData?.data;
                if (audioData) {
                    const mimeType = inlineData?.mimeType || inlineData?.mime_type || nestedInlineData?.mimeType || nestedInlineData?.mime_type;
                    log(`收到音频块 mimeType=${mimeType || 'audio/pcm;rate=24000'} bytes≈${Math.floor(audioData.length * 3 / 4)}`, 'gemini');
                    playAudioBase64(audioData, mimeType);
                }

                if (part.functionCall) {
                    log(`Gemini functionCall: ${JSON.stringify(part.functionCall)}`, 'system');
                }
            }

            if (data.serverContent.turnComplete) {
                log('Gemini 回复结束', 'system');
            }
        }

        async function ensureMicPermission() {
            if (micPermissionGranted) return;
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                throw new Error('当前浏览器或页面环境不支持麦克风，请使用 HTTPS 或 localhost');
            }

            const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
            stream.getTracks().forEach(track => track.stop());
            micPermissionGranted = true;
        }

        // ==========================================
        // 2. 麦克风采集与发送 (Input: 16kHz PCM)
        // ==========================================
        btnMic.onmousedown = startRecording;
        btnMic.onmouseup = stopRecording;
        btnMic.ontouchstart = startRecording;
        btnMic.ontouchend = stopRecording;

        async function startRecording(e) {
            e.preventDefault();
            if (!ws || ws.readyState !== WebSocket.OPEN) return;
            if (!micPermissionGranted) {
                log('请先点击“授权麦克风”', 'system');
                return;
            }
            ensurePlaybackReady();
            
            log('正在倾听...', 'user');
            btnMic.textContent = '松开结束';

            // 请求麦克风权限 (强制采样率为 16000)
            audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({ audio: true });
            } catch (error) {
                log(`无法打开麦克风: ${error.name || 'Error'} ${error.message || ''}`, 'system');
                btnMic.textContent = '3. 按住说话 (Push to Talk)';
                return;
            }
            const source = audioContext.createMediaStreamSource(mediaStream);

            // 使用 ScriptProcessorNode 提取原始 PCM 数据 (为了简便使用此方案，生产环境建议 AudioWorklet)
            processor = audioContext.createScriptProcessor(4096, 1, 1);
            
            processor.onaudioprocess = (e) => {
                const inputData = e.inputBuffer.getChannelData(0); // Float32Array (-1.0 to 1.0)
                
                // 将 Float32 转换为 Int16 (Gemini 需要 16-bit PCM)
                const pcm16 = new Int16Array(inputData.length);
                for (let i = 0; i < inputData.length; i++) {
                    let s = Math.max(-1, Math.min(1, inputData[i]));
                    pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7FFF;
                }

                // 将 Int16Array 转换为 Base64
                const base64Audio = arrayBufferToBase64(pcm16.buffer);

                // 发送给 Gemini API 的特定 JSON 格式
                const message = {
                    realtimeInput: {
                        audio: {
                            data: base64Audio,
                            mimeType: "audio/pcm;rate=16000"
                        }
                    }
                };
                ws.send(JSON.stringify(message));
            };

            source.connect(processor);
            processor.connect(audioContext.destination);
        }

        function stopRecording() {
            log('结束倾听，等待回复...', 'user');
            btnMic.textContent = '3. 按住说话 (Push to Talk)';
            if (processor) {
                processor.disconnect();
                processor = null;
            }
            if (mediaStream) {
                mediaStream.getTracks().forEach(track => track.stop());
                mediaStream = null;
            }
            if (audioContext) {
                audioContext.close();
                audioContext = null;
            }
        }

        // ==========================================
        // 3. 接收音频与播放 (Output: 24kHz PCM)
        // ==========================================
        function ensurePlaybackReady() {
            if (!playContext) {
                playContext = new (window.AudioContext || window.webkitAudioContext)();
                nextPlayTime = playContext.currentTime;
            }
            if (playContext.state === 'suspended') {
                playContext.resume().catch((error) => {
                    log(`音频播放解锁失败: ${error.message || error}`, 'system');
                });
            }
        }

        function sampleRateFromMimeType(mimeType) {
            const match = /rate=(\d+)/i.exec(mimeType || '');
            return match ? Number(match[1]) : 24000;
        }

        function playAudioBase64(base64, mimeType) {
            ensurePlaybackReady();
            if (!playContext) return;

            // 1. Base64 -> ArrayBuffer -> Int16Array
            const binaryString = atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            const pcm16 = new Int16Array(bytes.buffer, bytes.byteOffset, Math.floor(bytes.byteLength / 2));

            // 2. Int16Array -> Float32Array (AudioContext 需要 Float32)
            const float32Data = new Float32Array(pcm16.length);
            for (let i = 0; i < pcm16.length; i++) {
                float32Data[i] = pcm16[i] / (pcm16[i] < 0 ? 32768 : 32767);
            }

            // 3. 创建 AudioBuffer
            const outputSampleRate = sampleRateFromMimeType(mimeType);
            const audioBuffer = playContext.createBuffer(1, float32Data.length, outputSampleRate);
            audioBuffer.copyToChannel(float32Data, 0);

            // 4. 加入播放队列
            audioQueue.push(audioBuffer);
            playNextAudio();
        }

        function playNextAudio() {
            ensurePlaybackReady();
            if (!playContext || audioQueue.length === 0) return;

            while (audioQueue.length > 0) {
                const buffer = audioQueue.shift();
                const source = playContext.createBufferSource();
                source.buffer = buffer;
                source.connect(playContext.destination);

                const startAt = Math.max(nextPlayTime, playContext.currentTime + 0.02);
                source.start(startAt);
                nextPlayTime = startAt + buffer.duration;
                isPlaying = true;
                source.onended = () => {
                    if (playContext.currentTime >= nextPlayTime - 0.05) {
                        isPlaying = false;
                    }
                };
            }
        }

        // 工具函数：ArrayBuffer 转 Base64
        function arrayBufferToBase64(buffer) {
            let binary = '';
            const bytes = new Uint8Array(buffer);
            const len = bytes.byteLength;
            for (let i = 0; i < len; i++) {
                binary += String.fromCharCode(bytes[i]);
            }
            return window.btoa(binary);
        }
    </script>
</body>
</html>
