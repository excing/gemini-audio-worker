<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini 语音对话</title>
  <link rel="stylesheet" href="https://esm.sh/vue-sonner@2.0.9/lib/index.css" />
  <style>
    :root { color-scheme: light dark; --bg:#f9fafb; --surface:#fff; --glass:rgba(255,255,255,.72); --hover:#f3f4f6; --line:#e5e7eb; --text:#111827; --muted:#6b7280; --soft:#f6f7f9; --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; --shadow:0 24px 70px rgba(17,24,39,.12); }
    :root[data-theme="dark"] { color-scheme: dark; --bg:#1d1d1d; --surface:#000; --glass:rgba(9,9,11,.72); --hover:#18181b; --line:#27272a; --text:#fafafa; --muted:#a1a1aa; --soft:#111113; --shadow:0 24px 70px rgba(0,0,0,.42); }
    @media (prefers-color-scheme: dark) { :root[data-theme="system"] { color-scheme: dark; --bg:#1d1d1d; --surface:#000; --glass:rgba(9,9,11,.72); --hover:#18181b; --line:#27272a; --text:#fafafa; --muted:#a1a1aa; --soft:#111113; --shadow:0 24px 70px rgba(0,0,0,.42); } }
    * { box-sizing:border-box; } html, body, #app { width:100%; height:100%; } body { margin:0; overflow:hidden; font:14px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; color:var(--text); background:var(--bg); }
    body:not(.app-ready) #app { visibility:hidden; }
    body:not(.app-ready) { background:var(--bg); }
    .boot-screen { position:fixed; inset:0; z-index:9999; display:grid; place-items:center; background:var(--bg); color:var(--text); transition:opacity .2s ease-in-out, visibility .2s ease-in-out; }
    .boot-screen.hidden { opacity:0; visibility:hidden; pointer-events:none; }
    .boot-card { display:grid; justify-items:center; gap:14px; padding:20px 24px; text-align:center; }
    .boot-logo { width:52px; height:52px; border-radius:9999px; display:grid; place-items:center; background:var(--text); color:var(--bg); }
    .boot-spinner { width:28px; height:28px; border-radius:50%; border:3px solid rgba(127,127,127,.24); border-top-color:var(--text); animation:spin .8s linear infinite; }
    button, input, textarea, select { font:inherit; color:inherit; } button { border:0; cursor:pointer; transition:all .2s ease-in-out; } button:active { transform:scale(.97); } button:disabled { cursor:not-allowed; opacity:.45; transform:none; }
    .app-shell { --sidebar-width:320px; height:100dvh; display:grid; grid-template-columns:var(--sidebar-width) minmax(0,1fr); background:var(--bg); transition:grid-template-columns .24s ease-in-out; }
    .sidebar { position:relative; z-index:20; min-width:0; width:320px; height:100dvh; padding:16px; display:grid; grid-template-rows:auto auto minmax(0,1fr) auto; gap:16px; background:var(--glass); backdrop-filter:blur(12px) saturate(180%); box-shadow:10px 0 40px rgba(0,0,0,.06); overflow:hidden; opacity:1; transition:width .24s ease-in-out, padding .24s ease-in-out, opacity .18s ease-in-out, transform .24s ease-in-out; }
    .app-shell.sidebar-collapsed { --sidebar-width:0px; } .app-shell.sidebar-collapsed .sidebar { width:0; padding-inline:0; opacity:0; pointer-events:none; }
    .brand, .sidebar-head, .topbar, .role-row, .input-bar, .call-actions, .modal-actions, .tool-picker-head { display:flex; align-items:center; gap:8px; }
    .sidebar-head { justify-content:space-between; } .brand { min-width:0; font-size:16px; font-weight:600; } .brand-mark { width:32px; height:32px; border-radius:9999px; display:grid; place-items:center; background:var(--text); color:var(--bg); }
    .icon-btn { width:44px; height:44px; min-width:44px; border-radius:9999px; display:inline-grid; place-items:center; background:transparent; color:var(--text); } .icon-btn:hover, .role-row:hover, .menu-item:hover { background:var(--hover); } .icon-btn.danger { color:var(--bad); }
    .primary-btn { min-height:44px; padding:8px 12px; border-radius:9999px; display:inline-flex; align-items:center; justify-content:center; gap:8px; background:linear-gradient(135deg,#111827,#3f3f46); color:#fff; font-weight:600; }
    :root[data-theme="dark"] .primary-btn { background:linear-gradient(135deg,#fafafa,#a1a1aa); color:#1d1d1d; }
    .sidebar-actions { display:grid; gap:8px; } .menu-item { min-height:44px; padding:8px 12px; border-radius:12px; display:flex; justify-content: center; align-items:center; gap:10px; background:transparent; color:var(--text); text-align:left; font-weight:500; }
    .section-title { margin:0 0 8px; padding:0 8px; color:var(--muted); font-size:12px; font-weight:500; } .role-list { min-height:0; overflow:auto; display:grid; align-content:start; gap:4px; }
    .role-row { width:100%; min-width:0; min-height:48px; padding:6px 6px 6px 12px; border-radius:12px; background:transparent; text-align:left; } .role-row .icon-btn { flex:0 0 36px; width:36px; min-width:36px; height:36px; } .role-row.active { background:var(--hover); } .role-name { flex:1 1 auto; min-width:0; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:500; }
    .sidebar-foot { display:flex; justify-content:space-between; align-items:center; gap:8px; padding-top:8px; }
    .main { min-width:0; height:100dvh; display:grid; grid-template-rows:60px minmax(0,1fr) 76px; padding:0 max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); }
    .topbar { height:60px; justify-content:space-between; } .topbar-center { min-width:0; display:flex; align-items: center; justify-items:center; line-height:1.2; } .chat-title { max-width:min(39vw,520px); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; border-radius:8px; padding:2px 8px; font-size:16px; font-weight:600; background:transparent; } .chat-title:hover { background:var(--hover); }
    .dot { width:8px; height:8px; border-radius:9999px; background:transparent; } .dot.ok { background:var(--ok); } .dot.wait { background:var(--warn); } .dot.bad { background:var(--bad); }
    .chat-plane { min-height:0; overflow:hidden; position:relative; } #chat { height:100%; overflow:auto; padding:18px clamp(0px,5vw,96px); display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; }
    .group { max-width:min(76%,760px); display:grid; gap:4px; animation:pop .2s ease-in-out; } .group.user { align-self:flex-end; justify-items:end; } .group.ai,.group.system { align-self:flex-start; justify-items:start; } .role { padding:0 4px; color:var(--muted); font-size:12px; }
    .msg { padding:10px 14px; border-radius:12px; white-space:pre-wrap; overflow-wrap:anywhere; font-size:15px; } .ai .msg { padding:10px 5px } .user .msg { background:var(--text); color:var(--bg); } .system .msg { background:linear-gradient(135deg,rgba(16,185,129,.14),rgba(245,158,11,.12)); color:var(--text); }
    .progressive-text { white-space:pre-wrap; overflow-wrap:anywhere; } .progressive-text-played { color:inherit; opacity:1; transition:opacity .2s ease-in-out; } .progressive-text-pending { color:inherit; opacity:.42; transition:opacity .2s ease-in-out; } .caption-line { display:grid; grid-template-columns:minmax(0,1fr); gap:8px; align-items:start; padding:4px 0; } .caption-text { min-width:0; color:inherit; font-size:15px; line-height:1.5; } .caption-line.user .caption-text { color:var(--muted); opacity:.72; } .caption-line.ai .caption-text { color:var(--text); }
    .thought-card summary { min-height:28px; display:flex; align-items:center; gap:8px; cursor:pointer; user-select:none; font-size:13px; font-weight:700; list-style:none; }
    .thought-card summary::-webkit-details-marker { display:none; }
    .thought-card summary::before { content:""; width:8px; height:8px; border-right:2px solid currentColor; border-bottom:2px solid currentColor; transform:rotate(-45deg); transition:transform .18s ease-in-out; opacity:.72; }
    .thought-card[open] summary::before { transform:rotate(45deg); }
    .thought-text { margin:8px 0 0; padding:10px 12px; border-radius:8px; background:rgba(127,127,127,.08); white-space:pre-wrap; overflow-wrap:anywhere; font-size:13px; line-height:1.55; }
    .empty-state { height:100%; display:grid; place-items:center; color:var(--muted); text-align:center; } .empty-state strong { display:block; color:var(--text); font-size:20px; font-weight:600; }
    .input-disabled .input-bar .icon-btn, .input-disabled .input-bar .message-field, .input-disabled .input-bar .hold-record, .input-disabled .topbar .topbar-actions .icon-btn { cursor:not-allowed; opacity:.45; pointer-events:none; }
    .input-bar { min-height:64px; justify-content:space-between; align-items: end; padding-block:8px; } .message-field { flex:1; min-width:0; min-height:48px; max-height:120px; resize:none; overflow:auto; border:0; outline:none; border-radius:12px; padding:13px 14px; background:var(--hover); transition:all .2s ease-in-out; }
    .hold-record { flex:1; min-height:48px; border-radius:12px; background:var(--hover); color:var(--text); font-weight:600; } .hold-record.recording { background:linear-gradient(135deg,rgba(239,68,68,.9),rgba(245,158,11,.85)); color:#fff; }
    .call-screen { height:100dvh; display:grid; grid-template-rows:60px minmax(0,1fr) auto 82px; padding:0 max(16px,env(safe-area-inset-right)) max(10px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left)); background:var(--surface); }
    .call-stage { position:relative; min-height:0; display:grid; place-items:center; overflow:hidden; } .wave { width:min(44vw,260px); height:120px; display:flex; align-items:center; justify-content:center; gap:8px; } .wave span { width:7px; height:28px; border-radius:9999px; background:linear-gradient(180deg,#10b981,#60a5fa); animation:wave 1s ease-in-out infinite; } .wave span:nth-child(2){animation-delay:.1s}.wave span:nth-child(3){animation-delay:.2s}.wave span:nth-child(4){animation-delay:.3s}.wave span:nth-child(5){animation-delay:.4s}
    .caption-overlay { position:absolute; inset:0; min-height:0; overflow:hidden;  padding:14px; background:var(--glass); backdrop-filter:blur(12px) saturate(180%); color:var(--muted); pointer-events:none; } .caption-overlay .live-body { width:70%; height:70%; min-height:0; display:grid; align-content:start; gap:4px; overflow:auto; overscroll-behavior:contain; scrollbar-width:none; pointer-events:auto; } .caption-overlay .live-body::-webkit-scrollbar { display:none; }
    .call-status { display:grid; justify-items:center; gap:8px; padding:8px 0 14px; color:var(--muted); } .call-status .icon-btn { background:var(--hover); } .call-actions { display:grid; grid-template-columns:repeat(4,1fr); gap:0; min-height:72px; align-items:center; } .call-action { width:100%; min-width:0; min-height:72px; padding:4px 0; border-radius:12px; display:grid; justify-items:center; align-content:center; gap:4px; background:transparent; color:var(--muted); font-size:12px; } .call-action:hover { background:var(--hover); } .call-action .icon-btn { pointer-events:none; background:transparent; }
    dialog { width:min(680px,calc(100% - 24px)); border:0; border-radius:16px; padding:0; color:var(--text); background:var(--glass); box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(180%); transform:scale(.95); opacity:0; transition:all .2s ease-in-out; } dialog[open] { transform:scale(1); opacity:1; } dialog::backdrop { background:rgba(0,0,0,.4); backdrop-filter:blur(6px); } :root[data-theme="dark"] dialog::backdrop { background:rgba(0,0,0,.6); }
    .modal { padding:24px; display:grid; gap:16px; } .modal h2 { margin:0; font-size:20px; font-weight:600; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:grid; gap:7px; color:var(--muted); font-size:12px; } label.full, .tool-picker.full { grid-column:1/-1; }
    input, textarea, select { width:100%; min-height:44px; border:0; border-radius:8px; padding:0 12px; outline:none; background:var(--hover); } textarea { min-height:120px; padding:12px; resize:vertical; } .modal-actions { justify-content:flex-end; } .tool-actions, .tool-list { display:flex; flex-wrap:wrap; gap:8px; } .tool-chip, .tool-actions button { min-height:34px; border-radius:9999px; padding:0 12px; background:var(--hover); } .tool-chip.active { background:var(--text); color:var(--bg); } .warning { min-height:44px; border-radius:9999px; padding:8px 12px; background:var(--bad); color:#fff; } .secondary-btn { min-height:44px; border-radius:9999px; padding:8px 12px; background:var(--hover); }
    .danger-note { margin:0; padding:12px; border-radius:12px; background:rgba(239,68,68,.12); color:var(--bad); font-weight:600; }
    .render-card { display:grid; gap:8px; min-width:min(320px,70vw); max-width:100%; text-align:left; }
    .render-card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .render-card-title { font-weight:750; }
    .render-card-open { min-width:34px; min-height:34px; padding:0; border-radius:12px; font-size:16px; }
    .render-card-preview { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:white; pointer-events:none; }
    .render-card-preview iframe { width:100%; height:420px; border:0; background:white; }
    .render-dialog { width:min(1120px,calc(100% - 24px)); height:min(820px,calc(100dvh - 24px)); }
    .render-modal { height:100%; padding:14px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; }
    .render-modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); }
    .render-modal iframe { width:100%; min-height:100%; border:1px solid var(--line); border-radius:16px; background:white; }
    .render-modal-close { min-width:42px; min-height:42px; padding:0; border-radius:14px; font-size:22px; line-height:1; }
    .tool-call-card { display:grid; gap:10px; min-width:min(320px,72vw); max-width:min(560px,76vw); text-align:left; }
    .tool-call-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .tool-call-name { font-size:13px; font-weight:800; color:var(--muted); }
    .tool-call-badge { flex:0 0 auto; min-height:24px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:750; color:var(--muted); background:rgba(255,255,255,.08); display:inline-flex; align-items:center; gap:6px; }
    .tool-call-badge.running { color:var(--warn); }
    .tool-call-badge.done { color:var(--ok); }
    .tool-call-badge.error { color:var(--bad); }
    .tool-call-prompt, .tool-call-text, .tool-call-error { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .tool-call-prompt { color:var(--text); }
    .tool-call-text { color:var(--muted); }
    .tool-call-error { color:#ffd5da; }
    .tool-call-spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.24); border-top-color:var(--warn); border-radius:50%; animation:spin .8s linear infinite; }
    .tool-call-media { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .tool-call-image { display:block; width:100%; min-height: auto; object-fit:contain; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.22); }
    .tool-picker { display:grid; gap:10px; color:var(--muted); font-size:12px; } .tool-hint { color:var(--muted); }
    [data-sonner-toaster] [data-sonner-toast] [data-close-button] { left:auto !important; right:0 !important; transform:translate(40%, -40%); width: 28px; height: 28px; }
    @keyframes pop { from { transform:translateY(6px); opacity:0; } } @keyframes spin { to { transform:rotate(360deg); } } @keyframes wave { 0%,100% { height:28px; opacity:.55; } 50% { height:96px; opacity:1; } }
    @media (max-width:960px) { .app-shell { grid-template-columns:minmax(0,1fr); } .sidebar { position:fixed; width:280px; transform:translateX(-105%); } .drawer-open .sidebar { transform:translateX(0); } .app-shell.sidebar-collapsed { grid-template-columns:minmax(0,1fr); } .app-shell.sidebar-collapsed .sidebar { width:280px; padding:16px; } .drawer-scrim { position:fixed; inset:0; z-index:10; background:rgba(0,0,0,.28); } }
    @media (max-width:700px) { .main { grid-template-rows:56px minmax(0,1fr) 68px; padding-inline:max(10px,env(safe-area-inset-left)); } .topbar { height:56px; } .icon-btn { width:48px; height:48px; min-width:48px; } .group { max-width:94%; } #chat { padding:12px 0; } .grid { grid-template-columns:1fr; } .render-card,.tool-call-card{min-width:0; width:100%; max-width:100%}.render-card-preview iframe{height:280px}.render-modal{padding:10px}.render-dialog{width:calc(100% - 12px); height:calc(100dvh - 12px)} }
  </style>
</head>
<body>
  <div id="boot-screen" class="boot-screen" aria-live="polite" aria-label="正在加载">
    <div class="boot-card">
      <div class="boot-logo" aria-hidden="true">G</div>
      <div class="boot-spinner" aria-hidden="true"></div>
      <div>正在加载 Gemini 语音助手</div>
    </div>
  </div>
  <div id="app">
    <div class="app-shell" :class="{ 'sidebar-collapsed': sidebarCollapsed, 'drawer-open': drawerOpen }" v-show="uiMode === 'chat'">
      <div class="drawer-scrim" v-if="drawerOpen" @click="drawerOpen = false"></div>
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand"><span class="brand-mark"><sparkles-icon /></span><span>Gemini 语音助手</span></div>
          <button class="icon-btn" type="button" title="收起" @click="toggleSidebar"><panel-left-close-icon /></button>
        </div>
        <div class="sidebar-actions">
          <button class="primary-btn" type="button" @click="newChat"><message-circle-plus-icon></message-circle-plus-icon><span>新聊天</span></button>
          <button class="menu-item" type="button" @click="createRole"><user-plus-icon></user-plus-icon><span>新角色</span></button>
        </div>
        <div class="role-list">
          <p class="section-title">角色列表</p>
          <button v-for="role in allRoles" :key="role.id" class="role-row" :class="{ active: selectedRoleId === role.id }" type="button" @click="selectRoleById(role.id)">
            <span class="role-name">{{ role.name }}</span>
            <span class="icon-btn" title="打电话" @click.stop="enterCallMode(role.id)"><phone-icon /></span>
            <span class="icon-btn" title="配置" @click.stop="openRoleConfig(role.id)"><settings-2-icon /></span>
          </button>
        </div>
        <div class="sidebar-foot">
          <button class="icon-btn" type="button" :title="themeTitle" @click="cycleTheme"><component :is="themeIcon" /></button>
          <button class="icon-btn" type="button" title="系统配置" @click="openSystemSettings"><settings-icon /></button>
        </div>
      </aside>

      <main class="main" :class="{ 'input-disabled': isConnecting }">
        <header class="topbar">
          <button class="icon-btn" type="button" title="菜单" @click="toggleSidebar"><menu-icon /></button>
          <div class="topbar-center">
            <span class="dot" :class="statusKind"></span><button class="chat-title" type="button" @click="openRoleConfig()">{{ currentTitle }}</button>
          </div>
          <div class="topbar-actions">
            <button class="icon-btn" type="button" title="打电话" @click="enterCallMode()"><phone-icon /></button>
            <button class="icon-btn" type="button" :title="voiceEnabled ? '关闭自动朗读' : '打开自动朗读'" @click="toggleVoiceEnabled" :disabled="!canToggleAutoRead"><component :is="voiceEnabled ? 'volume-2-icon' : 'volume-x-icon'" /></button>
          </div>
        </header>

        <section class="chat-plane">
          <div v-if="!messageGroups.length" class="empty-state"><div><strong>Gemini 语音聊天</strong></div></div>
          <div id="chat" ref="chatEl" v-show="messageGroups.length">
          <div v-for="(item, index) in messageGroups" :key="item.message.id || index" class="group" :class="item.role">
            <div class="msg">
              <template v-if="item.message.type === 'renderPage'">
                <div class="render-card">
                  <div class="render-card-head">
                    <span class="render-card-title">{{ item.message.title }}</span>
                    <button class="secondary-btn render-card-open" type="button" title="放大预览" @click="openRenderedPage(item.message.renderId)"><maximize-2-icon /></button>
                  </div>
                  <div class="render-card-preview" aria-hidden="true">
                    <iframe sandbox="allow-scripts" referrerpolicy="no-referrer" :srcdoc="item.message.html"></iframe>
                  </div>
                </div>
              </template>
              <template v-else-if="item.message.type === 'toolCall'">
                <div class="tool-call-card">
                  <div class="tool-call-head">
                    <span class="tool-call-name">{{ toolDisplayName(item.message.name) }}</span>
                    <span class="tool-call-badge" :class="item.message.status">
                      <span v-if="item.message.status === 'running'" class="tool-call-spinner" aria-hidden="true"></span>
                      {{ toolStatusText(item.message.status) }}
                    </span>
                  </div>
                  <div v-if="item.message.prompt">
                    <p class="tool-call-prompt">{{ item.message.prompt }}</p>
                  </div>
                  <div class="tool-call-media" v-if="item.message.images?.length">
                    <a v-for="(image, imageIndex) in item.message.images" :key="imageIndex" :href="image.url" target="_blank" rel="noopener noreferrer" title="打开图片">
                      <img class="tool-call-image" :src="image.url" alt="生成图片" />
                    </a>
                  </div>
                  <p class="tool-call-text" v-if="item.message.text">{{ item.message.text }}</p>
                  <p class="tool-call-error" v-if="item.message.error">{{ item.message.error }}</p>
                </div>
              </template>
              <template v-else-if="item.message.type === 'thought'">
                <details class="thought-card">
                  <summary>{{ item.message.title || 'AI 思考过程' }}</summary>
                  <div class="thought-text">{{ item.message.text }}</div>
                </details>
              </template>
              <template v-else>
                <progressive-text
                  v-if="item.message.type === 'text'"
                  :text="item.message.text"
                  :caption="item.message.caption"
                  :active="item.role === 'Gemini'"
                ></progressive-text>
                <template v-else>{{ item.message.text || item.message }}</template>
              </template>
            </div>
          </div>
          </div>
        </section>

        <form class="input-bar" @submit.prevent="sendText">
          <button class="icon-btn" type="button" title="打电话" @click="enterCallMode()"><phone-icon /></button>
          <button v-if="inputMode === 'voice'" class="hold-record" type="button" :class="{ recording: micStatus === 'recording' }" :disabled="!canToggleVoice" @pointerdown="startHoldRecord" @pointerup="stopHoldRecord" @pointerleave="stopHoldRecord">按住说话</button>
          <textarea v-else class="message-field" :style="{ height: textStyleHeight }" v-model="text" rows="1" autocomplete="off" :placeholder="isConnecting ? '正在连接…' : '输入消息...'" :disabled="isConnecting" @input="resizeTextInput" @keydown="handleTextKeydown"></textarea>
          <button class="icon-btn" v-if="text.trim()" type="submit" :disabled="isConnecting" title="发送"><send-icon /></button>
          <button class="icon-btn" v-else-if="inputMode === 'voice'" type="button" title="文本输入" @click="toggleInputMode"><keyboard-icon /></button>

        </form>

        <button class="call-action" type="button"><span class="icon-btn"><video-icon /></span></button>

    <dialog ref="roleDialog" @click="closeRoleConfigOnBackdrop">

            <option v-for="voice in voices" :key="voice.name" :value="voice.name === 'No Voice' ? '' : voice.name">
              {{ voice.name }} - {{ voice.characteristics }}

                <button class="secondary-btn" type="button" :disabled="toolsLoading" @click="refreshToolDeclarations">{{ toolsLoading ? '刷新中' : '刷新' }}</button>
                <button class="secondary-btn" type="button" @click="setAllTools">全部</button>

              <div class="tool-list" v-if="toolDeclarations.length">

                  v-for="tool in toolDeclarations"

        <div class="modal-actions">

    <dialog ref="systemDialog" @click="closeSystemSettingsOnBackdrop">
      <div class="modal">

          <label class="full">深色浅色模式<select v-model="themeMode" @change="saveThemeMode">
            <option value="system">跟随系统</option>

    <dialog ref="deleteDialog" @click="closeDeleteOnBackdrop">
      <div class="modal">
        <h2>删除角色</h2>
        <p>确认删除「{{ pendingDeleteRole?.name || '' }}」？此操作无法撤销。</p>
        <p class="danger-note" v-if="isSessionActive && pendingDeleteRole?.id === selectedRoleId">当前正在连线该角色，确认删除后会自动断开。</p>
        <div class="modal-actions">
          <button class="secondary-btn" type="button" @click="closeDeleteDialog">取消</button>
          <button class="warning" type="button" @click="deleteRole">确认删除</button>

    <dialog class="render-dialog" ref="renderDialog" @click="closeRenderedPageOnBackdrop">
      <div class="render-modal">

          <strong>{{ activeRenderPage?.title || '页面渲染' }}</strong>
          <button class="secondary-btn render-modal-close" type="button" title="关闭预览" @click="closeRenderedPage"><x-icon /></button>
        </div>
        <iframe v-if="activeRenderPage" title="工具渲染页面预览" sandbox="allow-scripts" referrerpolicy="no-referrer" :srcdoc="activeRenderPage.html"></iframe>

  <script src="./constant.js"></script>
  <script src="./tools.js"></script>
  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.34/dist/vue.esm-browser.prod.js",
        "sonner": "https://unpkg.com/vue-sonner"
      }
    }
  </script>
  <script type="module">
    import { createApp, nextTick } from "vue";
    import { toast, Toaster } from "sonner";
    import { createAudioService } from "./audio-service.js";
    import {
      AudioLines, Captions, CaptionsOff, Keyboard, Maximize2, Menu, MessageCirclePlus, Mic, MicOff, Monitor, Moon, PanelLeftClose, Phone, PhoneOff, Repeat, ScreenShare, Send, Settings, Settings2, Sparkles, Square, Sun, UserPlus, Video, Volume2, VolumeX, X,
    } from "https://esm.sh/lucide-vue-next@1.0.0/es2022/lucide-vue-next.mjs";

    const models = window.APP_MODELS || [];
    const voices = window.APP_VOICES || [];

    const defaultRoles = window.DEFAULT_ROLES;
    const browserTools = window.BROWSER_TOOLS || { declarations: [], handlers: {} };

    const TOOL_CACHE_KEY = 'geminiToolDeclarations';

    const ProgressiveText = {
      props: {
        text: { type: String, default: '' },
        caption: { type: String, default: '' },
        active: { type: Boolean, default: false },
      },
      computed: {
        parts() {
          const text = String(this.text || '');
          if (!this.active) return { played: text, pending: '' };

          const caption = String(this.caption || '');
          if (!text || !caption) return { played: '', pending: text };
          if (text.startsWith(caption)) return { played: caption, pending: text.slice(caption.length) };

          const compactText = text.replace(/\s+/g, '');
          const compactCaption = caption.replace(/\s+/g, '');
          if (!compactCaption) return { played: '', pending: text };

          let matched = 0;
          for (let i = 0; i < text.length && matched < compactCaption.length; i += 1) {
            if (/\s/.test(text[i])) continue;
            if (text[i] !== compactCaption[matched]) break;
            matched += 1;
          }
          if (matched === compactCaption.length) {
            let playedEnd = 0;
            let seen = 0;
            while (playedEnd < text.length && seen < matched) {
              if (!/\s/.test(text[playedEnd])) seen += 1;
              playedEnd += 1;
            }
            return { played: text.slice(0, playedEnd), pending: text.slice(playedEnd) };
          }

          const index = text.indexOf(caption);
          if (index >= 0) {
            const playedEnd = index + caption.length;
            return { played: text.slice(0, playedEnd), pending: text.slice(playedEnd) };
          }

          const fallbackLength = Math.min(text.length, caption.length);
          return { played: text.slice(0, fallbackLength), pending: text.slice(fallbackLength) };
        },
      },
      template: `
        <span class="progressive-text">
          <span v-if="parts.played" class="progressive-text-played">{{ parts.played }}</span><span v-if="parts.pending" class="progressive-text-pending">{{ parts.pending }}</span>
        </span>
      `,
    };

    const app = createApp({
      data() {
        const defaultConfig = {
          name: 'Gemini 语音对话',
          model: 'gemini-3.1-flash-preview',
          voiceName: 'Kore',
          systemInstruction: 'You are a concise, friendly Chinese voice assistant.',
          autoLoadTools: '',
        };
        return {
          defaultConfig,
          models,
          voices,
          roles: [],
          default_roles: defaultRoles.map((role) => this.normalizeRole(role)),
          selectedRoleId: '',
          roleDraft: { ...defaultConfig },
          ws: null,
          audioService: null,
          aiAudioScheduledThisTurn: false,
          sessionStatus: 'idle',
          micStatus: 'idle',
          callAudioMode: localStorage.getItem('geminiCallAudioMode') || 'free',
          callTurnOwner: 'user',
          holdActive: false,
          voiceEnabled: JSON.parse(localStorage.getItem('geminiVoiceEnabled') || 'false'),
          text: '',
          textStyleHeight: '48px',
          pendingInitialMessages: [],
          pendingAiCaption: '',
          pendingAiMessageId: '',
          messageGroups: [],
          renderedPages: [],
          activeRenderPageId: '',
          toolDeclarations: this.loadCachedToolDeclarations(),
          toolsLoading: false,
          themeMode: localStorage.getItem('geminiThemeMode') || 'system',
          sidebarCollapsed: false,
          drawerOpen: false,
          uiMode: 'chat',
          inputMode: localStorage.getItem('geminiInputMode') || 'text',
          captionsVisible: true,
          pendingDeleteRole: null,
          editingRoleId: '',
        };
      },
      mounted() {
        this.applyTheme();
        this.roles = this.loadUserRoles();
        this.selectedRoleId = localStorage.getItem('geminiSelectedRoleId') || this.allRoles[0].id;
        this.audioService = createAudioService({
          getVoiceEnabled: () => this.voiceEnabled,
          canSendAudioInput: () => this.ws?.readyState === WebSocket.OPEN,
          shouldSendAudio: () => this.canSendAudioNow(),
          onAudioInput: (payload) => this.ws?.send(JSON.stringify(payload)),
          onCaptionDue: ({ text, messageId }) => this.addCaption('Gemini', text, messageId),
          onMicEnded: () => this.handleMicEnded(),
        });
        window.addEventListener('browser-tool-render-page', this.handleRenderedPage);
        this.loadToolDeclarations();
      },
      beforeUnmount() {
        window.removeEventListener('browser-tool-render-page', this.handleRenderedPage);
        this.audioService?.destroy();
      },
      watch: {
        themeMode() {
          this.applyTheme();
        },
        captionsVisible() {
          this.scrollCallCaptions();
        },
        uiMode(value) {
          if (value === 'call') this.scrollCallCaptions();
        },
      },
      computed: {
        allRoles() {
          return [...this.roles, ...(this.default_roles.map(role => this.normalizeRole(role)))];
        },
        currentRole() {
          return this.getRoleById(this.selectedRoleId);
        },
        currentRoleName() {
          return this.currentRole.name;
        },
        currentTitle() {
          return this.currentRoleName;
        },
        themeIcon() {
          if (this.themeMode === 'dark') return 'moon-icon';
          if (this.themeMode === 'light') return 'sun-icon';
          return 'monitor-icon';
        },
        themeTitle() {
          if (this.themeMode === 'dark') return '深色模式';
          if (this.themeMode === 'light') return '浅色模式';
          return '跟随系统';
        },
        callStatusText() {
          if (this.isConnecting) return '正在连接中...';
          if (this.callTurnOwner === 'model') return this.callAudioMode === 'free' ? '说话或点击打断' : '点击打断';
          if (this.callAudioMode === 'mute') return '已静音';
          return '正在听...';
        },
        callStateIcon() {
          if (this.callTurnOwner === 'model' || this.isConnecting) return 'square-icon';
          return this.callAudioMode === 'mute' ? 'mic-off-icon' : 'audio-lines-icon';
        },
        muteModeIcon() {
          if (this.callAudioMode === 'turn') return 'repeat-icon';
          if (this.callAudioMode === 'mute') return 'mic-off-icon';
          return 'mic-icon';
        },
        shouldSendAudio() {
          return this.canSendAudioNow();
        },
        activeRenderPage() {
          return this.renderedPages.find((page) => page.id === this.activeRenderPageId) || null;
        },
        canDeleteRole() {
          const roleId = this.editingRoleId || this.selectedRoleId;
          return !this.default_roles.some((role) => role.id === roleId);
        },
        statusText() { return this.sessionStateMeta.text; },
        statusKind() { return this.sessionStateMeta.kind; },
        sessionStateMeta() {
          switch (this.sessionStatus) {
            case 'idle': return { text: '未连接', kind: '' };
            case 'connecting': return { text: '连接中…', kind: 'wait' };
            case 'socket_open': return { text: '初始化…', kind: 'wait' };
            case 'session_open': return { text: '建立会话…', kind: 'wait' };
            case 'session_ready': return { text: '已连接', kind: 'ok' };
            case 'session_reconnecting': return { text: '恢复会话…', kind: 'wait' };
            case 'session_closed': return { text: '已关闭', kind: '' };
            case 'socket_closed': return { text: '已断开', kind: 'bad' };
            case 'error': return { text: '连接错误', kind: 'bad' };
            default: return { text: '未连接', kind: '' };
          }
        },
        isConnecting() {
          return ['connecting', 'socket_open', 'session_open', 'session_reconnecting'].includes(this.sessionStatus);
        },
        isSessionReady() {
          return this.sessionStatus === 'session_ready';
        },
        isSessionActive() {
          return ['connecting', 'socket_open', 'session_open', 'session_ready', 'session_reconnecting'].includes(this.sessionStatus);
        },
        canToggleVoice() {
          return this.isSessionReady && this.micStatus !== 'starting';
        },
        canToggleAutoRead() {
          return !this.isConnecting;
        },
        canSendText() {
          return this.isSessionReady && !!this.text.trim();
        },
        captionMessages() {
          return this.messageGroups
            .filter((item) => item.message?.type === 'text' && item.message.text)
            .slice(-4);
        },
      },
      methods: {
        toggleSidebar() {
          if (window.matchMedia('(max-width: 960px)').matches) this.drawerOpen = !this.drawerOpen;
          else this.sidebarCollapsed = !this.sidebarCollapsed;
        },
        cycleTheme() {
          const next = this.themeMode === 'system' ? 'light' : (this.themeMode === 'light' ? 'dark' : 'system');
          this.themeMode = next;
          this.saveThemeMode();
        },
        saveThemeMode() {
          localStorage.setItem('geminiThemeMode', this.themeMode);
          this.applyTheme();
        },
        openSystemSettings() {
          this.$refs.systemDialog.showModal();
        },
        closeSystemSettings() { this.$refs.systemDialog.close(); },
        closeSystemSettingsOnBackdrop(event) { if (event.target === this.$refs.systemDialog) this.closeSystemSettings(); },
        applyTheme() {
          document.documentElement.dataset.theme = this.themeMode;
        },
        createRole() {
          this.roleDraft = this.createDefaultRole();
          this.editingRoleId = '';
          this.$refs.roleDialog.showModal();
        },
        newChat() {
          this.interruptAiPlayback();
          this.holdActive = false;
          this.stopMic({ sendEnd: false, force: true });
          this.ws?.close(1000, 'New chat');
          this.messageGroups = [];
          this.setSessionStatus('idle');
          this.drawerOpen = false;
        },
        selectRoleById(roleId) {
          this.editingRoleId = '';
          this.saveSelectRoleId(roleId);
          this.newChat();
        },
        openRoleConfig(roleId = this.selectedRoleId) {
          this.editingRoleId = roleId;
          this.roleDraft = { ...this.getConfigById(roleId) };
          this.$refs.roleDialog.showModal();
        },
        enterCallMode(roleId = this.selectedRoleId) {
          if (roleId !== this.selectedRoleId) this.selectRoleById(roleId);
          this.precheckMic().then((ok) => {
            if (!ok) return;
            this.uiMode = 'call';
            this.drawerOpen = false;
            if (!this.isSessionActive) this.connect();
            this.startMic();
          });
        },
        exitCallMode() {
          this.uiMode = 'chat';
          this.holdActive = false;
          this.stopMic({ sendEnd: true, force: true });
        },
        toggleInputMode() {
          this.inputMode = this.inputMode === 'voice' ? 'text' : 'voice';
          localStorage.setItem('geminiInputMode', this.inputMode);
        },
        startHoldRecord() {
          if (this.holdActive) return;
          this.holdActive = true;
          this.precheckMic().then((ok) => {
            if (!ok) {
              this.holdActive = false;
              return;
            }
            if (!this.holdActive) return;
            this.interruptAiPlayback();
            if (!this.isSessionActive) this.connect();
            this.startMic();
          });
        },
        stopHoldRecord() {
          if (!this.holdActive) return;
          this.holdActive = false;
          this.stopMic({ sendEnd: true, force: true });
        },
        resizeTextInput(event) {
          const el = event.target;
          this.textStyleHeight = 'auto';
          nextTick(() => {
            this.textStyleHeight = `${Math.min(el.scrollHeight, 120)}px`;
          });
        },
        handleTextKeydown(event) {
          if (event.key !== 'Enter' || (!event.metaKey && !event.ctrlKey)) return;
          event.preventDefault();
          this.sendText();
        },
        createDefaultRole() {
          return { ...this.defaultConfig, id: `role-${Date.now()}` };
        },
        getRoleById(roleId) {
          return this.allRoles.find((role) => role.id === roleId) || this.allRoles[0];
        },
        normalizeRole(role) {
          const normalized = { ...this.defaultConfig, ...role };
          normalized.id ||= `role-${Date.now()}`;
          normalized.name = (normalized.name || this.defaultConfig.name).trim();
          return normalized;
        },
        loadUserRoles() {
          try {
            const roles = JSON.parse(localStorage.getItem('geminiRoles') || '[]').map((role) => this.normalizeRole(role));
            if (roles.length) return roles;
          } catch {}
          return [];
        },
        saveRoles() { localStorage.setItem('geminiRoles', JSON.stringify(this.roles)); },
        saveSelectRoleId(selectedRoleId) { this.selectedRoleId = selectedRoleId; localStorage.setItem('geminiSelectedRoleId', selectedRoleId); },
        getConfigById(roleId) {
          return this.getRoleById(roleId);
        },
        loadCachedToolDeclarations() {
          try {
            const cachedTools = JSON.parse(localStorage.getItem(TOOL_CACHE_KEY) || '[]');
            return this.mergeToolDeclarations(browserTools.declarations, Array.isArray(cachedTools) ? cachedTools : []);
          } catch {
            return this.mergeToolDeclarations(browserTools.declarations);
          }
        },
        mergeToolDeclarations(...toolGroups) {
          const toolMap = new Map();
          toolGroups.flat().filter(Boolean).forEach((tool) => {
            if (tool?.name && !toolMap.has(tool.name)) toolMap.set(tool.name, tool);
          });
          return [...toolMap.values()];
        },
        async loadToolDeclarations({ force = false } = {}) {
          if (this.toolsLoading) return;
          this.toolsLoading = true;
          try {
            const response = await fetch('/api/tools');
            const data = await response.json();
            if (Array.isArray(data.tools)) {
              this.toolDeclarations = this.mergeToolDeclarations(browserTools.declarations, data.tools);
              localStorage.setItem(TOOL_CACHE_KEY, JSON.stringify(this.toolDeclarations));
            }
            if (data.error) console.warn('Load MCP tools failed:', data.error);
          } catch (error) {
            console.warn('Load tools failed:', error);
          } finally {
            this.toolsLoading = false;
          }
        },
        refreshToolDeclarations() { this.loadToolDeclarations(); },
        selectedToolNames() {
          const value = (this.roleDraft.autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return this.toolDeclarations.map((tool) => tool.name);
          return value.split(',').map((name) => name.trim()).filter(Boolean);
        },
        updateSelectedTools(names) {
          const uniqueNames = names.filter((name, index) => name && names.indexOf(name) === index);
          this.roleDraft.autoLoadTools = uniqueNames.join(',');
        },
        isToolSelected(name) { return this.selectedToolNames().includes(name); },
        toggleTool(name) {
          const names = this.selectedToolNames();
          this.updateSelectedTools(names.includes(name) ? names.filter((item) => item !== name) : [...names, name]);
        },
        setAllTools() { this.roleDraft.autoLoadTools = '*'; },
        clearTools() { this.roleDraft.autoLoadTools = ''; },
        saveRoleConfig() {
          const isCreatingRole = !this.editingRoleId;
          const targetRoleId = isCreatingRole ? this.roleDraft.id : this.editingRoleId;
          const isSystemRole = !isCreatingRole && this.default_roles.some((role) => role.id === targetRoleId);
          const sourceRole = this.getRoleById(targetRoleId);
          const baseName = (this.roleDraft.name || sourceRole.name).trim() || '未命名角色';
          const name = isSystemRole && !baseName.includes('自定义')
            ? `${baseName}（自定义）`
            : baseName;
          const roleId = isCreatingRole || isSystemRole ? `role-${Date.now()}` : targetRoleId;
          const role = this.normalizeRole({ ...this.roleDraft, id: roleId, name });
          const index = this.roles.findIndex((item) => item.id === role.id);
          if (index >= 0) this.roles.splice(index, 1, role);
          else this.roles.push(role);
          this.editingRoleId = role.id;
          this.saveSelectRoleId(role.id);
          this.saveRoles();
          this.closeRoleConfig();
        },
        confirmDeleteRole() {
          if (!this.canDeleteRole) return;
          const targetRoleId = this.editingRoleId || this.selectedRoleId;
          this.pendingDeleteRole = this.roles.find((role) => role.id === targetRoleId);
          this.$refs.deleteDialog.showModal();
        },
        closeDeleteDialog() { this.$refs.deleteDialog.close(); },
        closeDeleteOnBackdrop(event) { if (event.target === this.$refs.deleteDialog) this.closeDeleteDialog(); },
        deleteRole() {
          if (!this.pendingDeleteRole) return;
          const deletingActiveRole = this.pendingDeleteRole.id === this.selectedRoleId;
          if (deletingActiveRole && this.isSessionActive) this.ws?.close(1000, 'Deleted active role');
          const index = this.roles.findIndex((role) => role.id === this.pendingDeleteRole.id);
          if (index < 0) return;
          const [deletedRole] = this.roles.splice(index, 1);
          const selectedRoleId = this.allRoles[0].id;
          this.roleDraft = { ...this.getConfigById(selectedRoleId) };
          this.editingRoleId = '';
          this.saveRoles();
          this.saveSelectRoleId(selectedRoleId);
          this.closeDeleteDialog();
          this.closeRoleConfig();
          this.pendingDeleteRole = null;
        },
        closeRoleConfig() { this.$refs.roleDialog.close(); },
        closeRoleConfigOnBackdrop(event) {
          if (event.target === this.$refs.roleDialog) {
            this.editingRoleId = '';
            this.closeRoleConfig();
          }
        },
        setSessionStatus(next) {
          this.sessionStatus = next;
        },
        canSendAudioNow() {
          if (!this.isSessionReady) return false;
          if (this.holdActive) return true;
          if (this.uiMode !== 'call') return false;
          if (this.callAudioMode === 'mute') return false;
          if (this.callAudioMode === 'turn' && this.callTurnOwner !== 'user') return false;
          if (this.callAudioMode === 'turn' && this.audioService?.hasQueuedPlayback()) return false;
          return true;
        },
        stopAiAudioPlayback() {
          this.audioService?.stopAiAudioPlayback();
        },
        syncPlaybackVolume() {
          this.audioService?.syncPlaybackVolume();
        },
        interruptAiPlayback() {
          this.stopAiAudioPlayback();
          this.aiAudioScheduledThisTurn = false;
          this.pendingAiCaption = '';
          this.pendingAiMessageId = '';
          this.callTurnOwner = 'user';
        },
        toggleCallAudioMode() {
          const order = ['free', 'turn', 'mute'];
          const idx = order.indexOf(this.callAudioMode);
          this.callAudioMode = order[(idx + 1) % order.length];
          localStorage.setItem('geminiCallAudioMode', this.callAudioMode);
        },
        toggleVoiceEnabled() {
          this.voiceEnabled = !this.voiceEnabled;
          localStorage.setItem('geminiVoiceEnabled', JSON.stringify(this.voiceEnabled));
          this.syncPlaybackVolume();
        },
        setupMessage() {
          const setup = {
            model: this.currentRole.model,
            generationConfig: { },
            systemInstruction: { parts: [{ text: this.currentRole.systemInstruction }] },
          };
          if (this.currentRole.voiceName) setup.generationConfig.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: this.currentRole.voiceName } } };
          setup.autoLoadTools = this.currentRole.autoLoadTools || '';
          const browserToolNames = this.selectedBrowserToolNames(setup.autoLoadTools);
          const browserToolDeclarations = browserTools.declarations.filter((tool) => browserToolNames.includes(tool.name));
          if (browserToolDeclarations.length) setup.tools = [{ functionDeclarations: browserToolDeclarations }];
          if (this.pendingInitialMessages.length) {
            setup.initialMessages = this.pendingInitialMessages;
            this.pendingInitialMessages = [];
          }
          return { setup };
        },
        selectedBrowserToolNames(autoLoadTools) {
          const browserToolNames = browserTools.declarations.map((tool) => tool.name);
          const value = (autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return browserToolNames;
          const selectedNames = value.split(',').map((name) => name.trim()).filter(Boolean);
          return browserToolNames.filter((name) => selectedNames.includes(name));
        },
        async handleBrowserToolCalls(functionCalls) {
          const functionResponses = [];
          for (const call of functionCalls) {
            const handler = browserTools.handlers?.[call.name];
            let response;
            if (!handler) {
              response = { error: `Unknown browser tool: ${call.name}` };
            } else {
              try {
                response = await handler(call.args || {});
              } catch (error) {
                response = { error: error.message || String(error) };
              }
            }
            functionResponses.push({ id: call.id, name: call.name, response });
          }
          if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ toolResponse: { functionResponses } }));
        },
        handleRenderedPage(event) {
          this.closeAiTextSegment();
          const page = {
            id: event.detail?.id || `render-${Date.now()}`,
            title: event.detail?.title || '页面渲染',
            html: String(event.detail?.html || ''),
          };
          this.renderedPages.push(page);
          this.addMessage('Gemini', {
            id: page.id,
            type: 'renderPage',
            renderId: page.id,
            title: page.title,
            html: page.html,
          });
          this.openRenderedPage(page.id);
        },
        openRenderedPage(renderId) {
          this.activeRenderPageId = renderId;
          nextTick(() => {
            if (!this.$refs.renderDialog.open) this.$refs.renderDialog.showModal();
          });
        },
        closeRenderedPage() {
          this.$refs.renderDialog.close();
        },
        closeRenderedPageOnBackdrop(event) {
          if (event.target === this.$refs.renderDialog) this.closeRenderedPage();
        },
        async connect() {
          if (this.isSessionActive) return;
          this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
          this.interruptAiPlayback();
          this.setSessionStatus('connecting');
          this.ws.onopen = async () => { await this.ensureAudio(); this.setSessionStatus('socket_open'); };
          this.ws.onmessage = (event) => {
            let payload;
            try {
              payload = JSON.parse(event.data);
            } catch (err) {
              console.warn('Failed to parse WS message:', err, event.data);
              return;
            }
            this.handleMessage(payload);
          };
          this.ws.onerror = () => this.setSessionStatus('error');
          this.ws.onclose = (event) => {
            this.interruptAiPlayback();
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
            this.setSessionStatus(event.code == 1000 ? 'session_closed' : 'socket_closed');
            if (this.uiMode === 'call') this.uiMode = 'chat';
          };
        },
        handleMessage(msg) {
          if (msg.systemContent) {
            this.handleSystemContent(msg.systemContent);
            return;
          }
          if (msg.workerStatus) {
            if (msg.workerStatus.type === 'gemini_close') this.ws?.close(1000, 'User disconnected');
            if (msg.workerStatus.type === 'gemini_open') {
              this.setSessionStatus('session_open');
              this.ws.send(JSON.stringify(this.setupMessage()));
            }
            if (msg.workerStatus.type === 'session_reconnect' || msg.workerStatus.type === 'session_resuming') {
              this.setSessionStatus('session_reconnecting');
            }
            if (msg.workerStatus.type === 'session_reconnected') {
              this.setSessionStatus('session_reconnecting');
            }
            return;
          }
          if (msg.setupComplete) {
            this.setSessionStatus('session_ready');
            this.callTurnOwner = 'user';
            if (this.uiMode === 'call' && this.callAudioMode !== 'mute') this.playReadyTone({ type: 'triangle'});
            return;
          }
          const browserFunctionCalls = (msg.toolCall?.functionCalls || []).filter((call) => browserTools.handlers?.[call.name]);
          if (browserFunctionCalls.length) {
            this.closeAiTextSegment();
            this.handleBrowserToolCalls(browserFunctionCalls);
            return;
          }
          const content = msg.serverContent;
          if (!content) return;
          if (content.interrupted) {
            this.interruptAiPlayback();
            this.aiAudioScheduledThisTurn = false;
            this.pendingAiMessageId = '';
            return;
          }
          if (!!content.outputTranscription?.text || !!content.modelTurn?.parts?.length) this.callTurnOwner = 'model';
          if (content.inputTranscription?.text) {
            this.closeAiTextSegment();
            this.addTranscript('user', content.inputTranscription.text);
          }
          if (content.outputTranscription?.text) {
            this.ensureAiTextSegment();
            this.addTranscript('Gemini', content.outputTranscription.text, this.pendingAiMessageId);
            this.pendingAiCaption += content.outputTranscription.text;
          }
          for (const part of content.modelTurn?.parts || []) {
            if (part.text) {
              if (part.thought) {
                this.closeAiTextSegment();
                this.addThought(part.text);
              } else {
                this.ensureAiTextSegment();
                this.addTranscript('Gemini', part.text, this.pendingAiMessageId);
                this.pendingAiCaption += part.text;
              }
            }
            if (part.inlineData?.data) {
              this.aiAudioScheduledThisTurn = true;
              this.playPcm(part.inlineData.data, part.inlineData.mimeType, this.pendingAiCaption, this.pendingAiMessageId);
            }
          }
          if (content.turnComplete) {
            this.pendingAiCaption = '';
            this.pendingAiMessageId = '';
            this.aiAudioScheduledThisTurn = false;
            this.callTurnOwner = 'user';
            if (this.uiMode === 'call' && this.callAudioMode === 'turn') {
              this.playReadyTone({ queued: true });
            }
          }
        },
        handleSystemContent(systemContent) {
          const toolCall = systemContent?.toolCall;
          if (!toolCall) return;
          this.closeAiTextSegment();

          const id = toolCall.id || `tool-call-${Date.now()}`;
          const existing = this.findToolCallMessage(id);
          const result = toolCall.result || null;
          const images = (Array.isArray(result?.images) ? result.images : [])
            .map((image) => this.normalizeGeneratedImage(image))
            .filter(Boolean);
          const nextMessage = {
            ...(existing?.message || {}),
            id,
            type: 'toolCall',
            name: toolCall.name || existing?.message?.name || 'tool',
            status: toolCall.error ? 'error' : (result ? 'done' : 'running'),
            prompt: typeof toolCall.prompt === 'string' ? toolCall.prompt.trim() : (existing?.message?.prompt || ''),
            images,
            text: String(result?.text || '').trim(),
            error: toolCall.error ? String(toolCall.error) : '',
          };

          if (existing) this.messageGroups.splice(existing.index, 1, { role: 'system', message: nextMessage });
          else this.addMessage('system', nextMessage);

          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
        },
        findToolCallMessage(id) {
          for (let index = this.messageGroups.length - 1; index >= 0; index -= 1) {
            const item = this.messageGroups[index];
            if (item.role === 'system' && item.message?.type === 'toolCall' && item.message.id === id) {
              return { index, message: item.message };
            }
          }
          return null;
        },
        normalizeGeneratedImage(image) {
          if (!image) return null;
          if (typeof image === 'string') return { url: image };
          if (image.url) return { url: image.url };
          if (image.b64_json) return { url: `data:image/png;base64,${image.b64_json}` };
          return null;
        },
        toolDisplayName(name) {
          if (name === 'imageGeneration') return '图片生成';
          return name || '工具调用';
        },
        toolStatusText(status) {
          if (status === 'done') return '完成';
          if (status === 'error') return '失败';
          return '进行中';
        },
        ensureAiTextSegment() {
          if (!this.pendingAiMessageId) this.pendingAiMessageId = `ai-msg-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          return this.pendingAiMessageId;
        },
        closeAiTextSegment() {
          this.pendingAiCaption = '';
          this.pendingAiMessageId = '';
        },
        addThought(text) {
          if (!text) return;
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === 'Gemini' && lastItem.message?.type === 'thought') {
            lastItem.message.text += text;
            nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
            return;
          }
          this.addMessage('Gemini', { type: 'thought', text, title: '思考过程' });
        },
        addCaption(role, text, messageId = '') {
          if (!text) return;
          if (messageId) {
            const target = this.findMessageById(messageId);
            if (target?.role === role && target.message?.type === 'text') {
              target.message.caption = text;
              this.scrollCallCaptions();
              return;
            }
            this.addMessage(role, text, messageId);
            return;
          }
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === role && lastItem.message?.type === 'text') {
            lastItem.message.caption = text;
            this.scrollCallCaptions();
            return;
          }
          this.addMessage(role, text, messageId);
        },
        addTranscript(role, text, messageId = '') {
          if (!text) return;
          if (messageId) {
            const target = this.findMessageById(messageId);
            if (target?.role === role && target.message?.type === 'text') {
              target.message.text += text;
              nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
              this.scrollCallCaptions();
              return;
            }
            this.addMessage(role, text, messageId);
            return;
          }
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === role && lastItem.message?.type === 'text') {
            lastItem.message.text += text;
            nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
            this.scrollCallCaptions();
            return;
          }
          this.addMessage(role, text, messageId);
        },
        addMessage(role, content, messageId = '') {
          const message = typeof content === 'string' ? { type: 'text', text: content, caption: '' } : content;
          if (!message || (message.type === 'text' && !message.text)) return;
          if (messageId && !message.id) message.id = messageId;
          if (!message.id) message.id = `${role}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          this.messageGroups.push({ role, message });
          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
          this.scrollCallCaptions();
        },
        scrollCallCaptions() {
          nextTick(() => {
            const el = this.$refs.callCaptionEl;
            if (el) el.scrollTop = el.scrollHeight;
          });
        },
        async ensureAudio() {
          await this.audioService?.ensureAudio();
        },
        async playReadyTone(options = {}) {
          await this.audioService?.playReadyTone(options);
        },
        async playPcm(data, mime = 'audio/pcm;rate=24000', caption = "", messageId = '') {
          await this.audioService?.playPcm(data, mime, caption, messageId);
        },
        findMessageById(messageId) {
          if (!messageId) return null;
          for (let index = this.messageGroups.length - 1; index >= 0; index -= 1) {
            const item = this.messageGroups[index];
            if (item?.message?.id === messageId) return item;
          }
          return null;
        },
        async precheckMic() {
          try {
            await this.audioService?.checkMicAvailable();
            return true;
          } catch (err) {
            this.showMicError(err);
            return false;
          }
        },
        showMicError(error) {
          const name = error?.name || '';
          if (name === 'InsecureContextError') {
            toast.error('当前页面非安全上下文', { description: '请通过 HTTPS 或 localhost 访问才能使用麦克风' });
          } else if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            toast.error('麦克风未授权', { description: '请在浏览器设置中允许麦克风权限后重试' });
          } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
            toast.error('未检测到麦克风', { description: '请检查麦克风是否连接' });
          } else if (name === 'NotReadableError' || name === 'TrackStartError') {
            toast.error('麦克风被占用', { description: '请关闭其他正在使用麦克风的应用后重试' });
          } else if (name === 'NotSupportedError') {
            toast.error('当前浏览器不支持麦克风');
          } else {
            toast.error('麦克风启动失败', { description: error?.message || '请稍后重试' });
          }
        },
        async startMic() {
          if (this.micStatus !== 'idle') return;
          this.micStatus = 'starting';
          try {
            const started = await this.audioService?.startMic();
            if (!started) throw new Error('mic not started');
            this.micStatus = 'recording';
          } catch (error) {
            this.micStatus = 'idle';
            this.showMicError(error);
            this.handleMicEnded();
          }
        },
        stopMic(options = {}) {
          const { sendEnd = true, force = false } = options;
          if (!force && this.holdActive) return;
          const wasRecording = this.micStatus === 'recording';
          if (sendEnd && wasRecording && this.isSessionActive && this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          this.audioService?.stopMic();
          this.micStatus = 'idle';
        },
        handleMicEnded() {
          if (this.uiMode === 'call') {
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
            this.uiMode = 'chat';
          } else if (this.holdActive) {
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
          }
        },
        sendText() {
          const value = this.text.trim();
          if (!value) return;
          if (this.canSendText) {
            this.interruptAiPlayback();
            this.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: value }] }], turnComplete: true } }));
            this.closeAiTextSegment();
            this.addMessage('user', value);
            this.text = '';
            this.textStyleHeight = '48px';
            return;
          }
          if (!this.isSessionActive) {
            this.pendingInitialMessages.push({ role: 'user', parts: [{ text: value }] });
            this.closeAiTextSegment();
            this.addMessage('user', value);
            this.text = '';
            this.textStyleHeight = '48px';
            this.connect();
          }
        },
      },
    });

    const lucideComponents = {
      'audio-lines-icon': AudioLines,
      'captions-icon': Captions,
      'captions-off-icon': CaptionsOff,
      'keyboard-icon': Keyboard,
      'maximize-2-icon': Maximize2,
      'menu-icon': Menu,
      'message-circle-plus-icon': MessageCirclePlus,
      'mic-icon': Mic,
      'mic-off-icon': MicOff,
      'monitor-icon': Monitor,
      'moon-icon': Moon,
      'panel-left-close-icon': PanelLeftClose,
      'phone-icon': Phone,
      'phone-off-icon': PhoneOff,
      'repeat-icon': Repeat,
      'screen-share-icon': ScreenShare,
      'send-icon': Send,
      'settings-icon': Settings,
      'settings-2-icon': Settings2,
      'sparkles-icon': Sparkles,
      'square-icon': Square,
      'sun-icon': Sun,
      'user-plus-icon': UserPlus,
      'video-icon': Video,
      'volume-2-icon': Volume2,
      'volume-x-icon': VolumeX,
      'x-icon': X,
    };
    Object.entries(lucideComponents).forEach(([name, component]) => app.component(name, component));
    app.component('progressive-text', ProgressiveText);
    app.component('toaster', Toaster);
    app.mount('#app');
    document.body.classList.add('app-ready');
    const bootScreen = document.getElementById('boot-screen');
    if (bootScreen) bootScreen.classList.add('hidden');
  </script>
</body>
