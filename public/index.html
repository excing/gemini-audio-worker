  <title>Gemini 语音对话</title>
  <script>
    (() => {
      const THEME_COLORS = {
        light: { browser: '#f9fafb', appleStatusBar: 'default' },
        dark: { browser: '#09090B', appleStatusBar: 'black-translucent' },
      };
      const root = document.documentElement;
      const media = window.matchMedia?.('(prefers-color-scheme: dark)');
      const getMeta = (name) => {
        let meta = document.querySelector(`meta[name="${name}"]`);
        if (!meta) {
          meta = document.createElement('meta');
          meta.name = name;
          document.head.appendChild(meta);
        }
        return meta;
      };
      const resolveTheme = (themeMode) => themeMode === 'system'
        ? (media?.matches ? 'dark' : 'light')
        : themeMode;

      window.applyGeminiTheme = (themeMode = localStorage.getItem('geminiThemeMode') || 'system') => {
        const theme = THEME_COLORS[resolveTheme(themeMode)] || THEME_COLORS.light;
        root.dataset.theme = themeMode;
        getMeta('theme-color').content = theme.browser;
        getMeta('msapplication-navbutton-color').content = theme.browser;
        getMeta('apple-mobile-web-app-status-bar-style').content = theme.appleStatusBar;
      };

      window.applyGeminiTheme();
      const handleSystemThemeChange = () => {
        if ((localStorage.getItem('geminiThemeMode') || 'system') === 'system') window.applyGeminiTheme('system');
      };
      if (media?.addEventListener) media.addEventListener('change', handleSystemThemeChange);
      else if (media?.addListener) media.addListener(handleSystemThemeChange);
    })();
  </script>

        </div>
        <div class="role-list">

  <script type="importmap">
    {
      "imports": {
        "vue": "https://unpkg.com/vue@3.5.34/dist/vue.esm-browser.prod.js",
        "sonner": "https://unpkg.com/vue-sonner"

  <script type="module">
    import { createApp, nextTick } from "vue";
    import { toast, Toaster } from "sonner";
    import { createAudioService } from "./audio-service.js";
    import { createMediaService } from "./media-service.js";
    import {
      AudioLines, Captions, CaptionsOff, Check, Copy, Keyboard, Maximize2, Menu, MessageCirclePlus, Mic, MicOff, Monitor, Moon, PanelLeftClose, Phone, PhoneOff, Repeat, ScreenShare, ScreenShareOff, Send, Settings, Settings2, Sparkles, Square, Sun, SwitchCamera, UserPlus, Video, VideoOff, Volume2, VolumeX, X,
    } from "https://esm.sh/lucide-vue-next@1.0.0/es2022/lucide-vue-next.mjs";

    const models = window.APP_MODELS || [];
    const voices = window.APP_VOICES || [];

    const defaultRoles = window.DEFAULT_ROLES;
    const browserTools = window.BROWSER_TOOLS || { declarations: [], handlers: {} };

    const TOOL_CACHE_KEY = 'geminiToolDeclarations';

    async function copyTextToClipboard(text) {
      if (text == null) return false;
      const value = String(text);
      try {
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          await navigator.clipboard.writeText(value);
          return true;
        }
      } catch (_) { /* fall back to legacy path */ }
      try {
        const textarea = document.createElement('textarea');
        textarea.value = value;
        textarea.setAttribute('readonly', '');
        textarea.style.position = 'fixed';
        textarea.style.opacity = '0';
        textarea.style.pointerEvents = 'none';
        document.body.appendChild(textarea);
        textarea.focus();
        textarea.select();
        const ok = document.execCommand('copy');
        document.body.removeChild(textarea);
        return ok;
      } catch (_) {
        return false;
      }
    }

    const ProgressiveText = {
      props: {
        text: { type: String, default: '' },
        caption: { type: String, default: '' },
        active: { type: Boolean, default: false },
      },
      computed: {
        parts() {
          const text = String(this.text || '');
          if (!this.active) return { played: text, pending: '' };

          const caption = String(this.caption || '');
          if (!text || !caption) return { played: '', pending: text };
          if (text.startsWith(caption)) return { played: caption, pending: text.slice(caption.length) };

          const compactText = text.replace(/\s+/g, '');
          const compactCaption = caption.replace(/\s+/g, '');
          if (!compactCaption) return { played: '', pending: text };

          let matched = 0;
          for (let i = 0; i < text.length && matched < compactCaption.length; i += 1) {
            if (/\s/.test(text[i])) continue;
            if (text[i] !== compactCaption[matched]) break;
            matched += 1;
          }
          if (matched === compactCaption.length) {
            let playedEnd = 0;
            let seen = 0;
            while (playedEnd < text.length && seen < matched) {
              if (!/\s/.test(text[playedEnd])) seen += 1;
              playedEnd += 1;
            }
            return { played: text.slice(0, playedEnd), pending: text.slice(playedEnd) };
          }

          const index = text.indexOf(caption);
          if (index >= 0) {
            const playedEnd = index + caption.length;
            return { played: text.slice(0, playedEnd), pending: text.slice(playedEnd) };
          }

          const fallbackLength = Math.min(text.length, caption.length);
          return { played: text.slice(0, fallbackLength), pending: text.slice(fallbackLength) };
        },
      },
      template: `
        <span class="progressive-text">
          <span v-if="parts.played" class="progressive-text-played">{{ parts.played }}</span><span v-if="parts.pending" class="progressive-text-pending">{{ parts.pending }}</span>
        </span>
      `,
    };

    const HoldRecord = {
      props: {
        modelValue: { type: Boolean, default: false },
        micStatus: { type: String, default: 'idle' },
        maxMs: { type: Number, default: 15000 },
        beforeStart: { type: Function, default: null },
      },
      emits: ['update:modelValue', 'release'],
      data() {
        return {
          holdProgress: 0,
          holdRafId: null,
        };
      },
      computed: {
        holdRemainingSec() {
          return Math.max(0, Math.ceil((1 - this.holdProgress) * (this.maxMs / 1000)));
        },
      },
      watch: {
        modelValue(value) {
          if (!value) this.stopProgress();
        },
      },
      beforeUnmount() {
        this.stopProgress();
      },
      methods: {
        async handlePointerDown() {
          if (this.modelValue) return;
          this.$emit('update:modelValue', true);
          if (this.beforeStart) {
            let ok = false;
            try { ok = await this.beforeStart(); }
            catch { ok = false; }
            if (!this.modelValue) return;
            if (!ok) { this.$emit('update:modelValue', false); return; }
          }
          this.startProgress();
        },
        handlePointerUp() {
          if (!this.modelValue) return;
          this.$emit('update:modelValue', false);
          this.$emit('release', { reason: 'pointer' });
        },
        startProgress() {
          this.stopProgress();
          const startTs = performance.now();
          const tick = () => {
            if (!this.modelValue) { this.holdRafId = null; return; }
            const ratio = Math.min(1, (performance.now() - startTs) / this.maxMs);
            this.holdProgress = ratio;
            if (ratio >= 1) {
              this.holdRafId = null;
              this.$emit('update:modelValue', false);
              this.$emit('release', { reason: 'timeout' });
              return;
            }
            this.holdRafId = requestAnimationFrame(tick);
          };
          this.holdRafId = requestAnimationFrame(tick);
        },
        stopProgress() {
          if (this.holdRafId) cancelAnimationFrame(this.holdRafId);
          this.holdRafId = null;
          this.holdProgress = 0;
        },
      },
      template: `
        <button
          class="hold-record"
          type="button"
          :class="{ recording: micStatus === 'recording' }"
          :style="{ '--hold-progress': (holdProgress * 100) + '%' }"
          @mousedown="handlePointerDown"
          @mouseup="handlePointerUp"
          @mouseleave="handlePointerUp"
          @touchstart.prevent="handlePointerDown"
          @touchend.prevent="handlePointerUp"
          @touchcancel.prevent="handlePointerUp"
          @contextmenu.prevent
        >{{ modelValue ? \`松开发送 · \${holdRemainingSec}s\` : '按住说话' }}</button>
      `,
    };

    const app = createApp({
      data() {
        const defaultConfig = {
          name: 'Gemini 语音对话',
          model: 'gemini-3.1-flash-preview',
          voiceName: 'Kore',
          systemInstruction: 'You are a concise, friendly Chinese voice assistant.',
          autoLoadTools: '',
        };
        return {
          defaultConfig,
          models,
          voices,
          roles: [],
          default_roles: defaultRoles.map((role) => this.normalizeRole(role)),
          selectedRoleId: '',
          roleDraft: { ...defaultConfig },
          ws: null,
          audioService: null,
          mediaService: null,
          aiAudioScheduledThisTurn: false,
          sessionStatus: 'idle',
          micStatus: 'idle',
          callAudioMode: localStorage.getItem('geminiCallAudioMode') || 'free',
          callTurnOwner: 'user',
          holdActive: false,
          voiceEnabled: JSON.parse(localStorage.getItem('geminiVoiceEnabled') || 'false'),
          text: '',
          textStyleHeight: '48px',
          pendingClientPayloads: [],
          pendingAiCaption: '',
          pendingAiMessageId: '',
          messageGroups: [],
          activeRenderPage: null,
          toolDeclarations: this.loadCachedToolDeclarations(),
          toolsLoading: false,
          themeMode: localStorage.getItem('geminiThemeMode') || 'system',
          sidebarCollapsed: false,
          drawerOpen: false,
          uiMode: 'chat',
          inputMode: localStorage.getItem('geminiInputMode') || 'text',
          captionsVisible: true,
          callMediaMode: 'none',
          mediaStarting: false,
          cameraFacing: 'user',
          pendingDeleteRole: null,
          editingRoleId: '',
          aiWaveBars: [0, 0, 0, 0, 0],
          userWaveBars: [0, 0, 0, 0, 0],
          waveRafId: null,
        };
      },
      mounted() {
        this.roles = this.loadUserRoles();
        this.selectedRoleId = localStorage.getItem('geminiSelectedRoleId') || this.allRoles[0].id;
        this.audioService = createAudioService({
          getVoiceEnabled: () => this.voiceEnabled,
          shouldSendAudio: () => this.canSendAudioNow(),
          onAudioInput: (audio) => {
            const input = {
              realtimeInput: { audio },
            };
            if (this.holdActive) {
              this.pendingClientPayloads.push(input);
            } else {
              this.ws?.send(JSON.stringify(input));
            }
          },
          onCaptionDue: ({ text, messageId }) => this.addCaption('Gemini', text, messageId),
          onMicEnded: () => this.handleMicEnded(),
        });
        this.mediaService = createMediaService({
          onFrame: ({ data, mimeType }) => {
            if (this.ws?.readyState === WebSocket.OPEN) {
              this.ws.send(JSON.stringify({ realtimeInput: { video: { data, mimeType } } }));
            }
          },
          onSourceEnded: (source) => {
            this.callMediaMode = 'none';
            if (source === 'screen') toast.info('已停止屏幕分享');
            else if (source === 'camera') toast.info('摄像头已关闭');
          },
        });
        this.loadToolDeclarations();
      },
      beforeUnmount() {
        this.stopWaveLoop();
        this.audioService?.destroy();
        this.mediaService?.destroy();
      },
      watch: {

        uiMode(value) {

            this.stopWaveLoop();
            this.stopCallMedia();
          }
        },
      },
      computed: {
        allRoles() {
          return [...this.roles, ...(this.default_roles.map(role => this.normalizeRole(role)))];
        },
        currentRole() {

        },
        currentRoleName() {

        currentTitle() {

        themeIcon() {

        themeTitle() {
          if (this.themeMode === 'dark') return '深色模式';

        },
        callStatusText() {
          if (this.isConnecting) return '正在连接中...';

          if (this.callAudioMode === 'mute') return '已静音';

        },
        callStateIcon() {

        },
        muteModeIcon() {
          if (this.callAudioMode === 'turn') return 'repeat-icon';
          if (this.callAudioMode === 'mute') return 'mic-off-icon';

        },
        showUserWave() {
          return this.callStateIcon === 'audio-lines-icon';
        },
        canDeleteRole() {
          const roleId = this.editingRoleId || this.selectedRoleId;

        },
        statusText() { return this.sessionStateMeta.text; },
        statusKind() { return this.sessionStateMeta.kind; },
        sessionStateMeta() {
          switch (this.sessionStatus) {
            case 'idle': return { text: '未连接', kind: '' };
            case 'connecting': return { text: '连接中…', kind: 'wait' };
            case 'socket_open': return { text: '初始化…', kind: 'wait' };
            case 'session_open': return { text: '建立会话…', kind: 'wait' };
            case 'session_ready': return { text: '已连接', kind: 'ok' };
            case 'session_reconnecting': return { text: '恢复会话…', kind: 'wait' };
            case 'session_closed': return { text: '已关闭', kind: '' };
            case 'socket_closed': return { text: '已断开', kind: 'bad' };
            case 'error': return { text: '连接错误', kind: 'bad' };
            default: return { text: '未连接', kind: '' };
          }
        },
        isConnecting() {
          return ['connecting', 'socket_open', 'session_open', 'session_reconnecting'].includes(this.sessionStatus);
        },
        isSessionReady() {
          return this.sessionStatus === 'session_ready';
        },
        isSessionActive() {
          return ['connecting', 'socket_open', 'session_open', 'session_ready', 'session_reconnecting'].includes(this.sessionStatus);
        },
        canToggleVoice() {
          return this.isSessionReady && this.micStatus !== 'starting';
        },
        canToggleAutoRead() {
          return !this.isConnecting;
        },
        captionMessages() {
          return this.messageGroups
            .filter((item) => item.message?.type === 'text' && item.message.text)
            .slice(-4);
        },
      },
      methods: {
        toggleSidebar() {
          if (window.matchMedia('(max-width: 960px)').matches) this.drawerOpen = !this.drawerOpen;
          else this.sidebarCollapsed = !this.sidebarCollapsed;
        },
        cycleTheme() {
          const next = this.themeMode === 'system' ? 'light' : (this.themeMode === 'light' ? 'dark' : 'system');
          this.themeMode = next;
          this.saveThemeMode();
        },
        saveThemeMode() {
          localStorage.setItem('geminiThemeMode', this.themeMode);
        },
        openSystemSettings() {
          this.$refs.systemDialog.showModal();
        },
        closeSystemSettings() { this.$refs.systemDialog.close(); },
        closeSystemSettingsOnBackdrop(event) { if (event.target === this.$refs.systemDialog) this.closeSystemSettings(); },
        applyTheme() {
          window.applyGeminiTheme?.(this.themeMode);
        },
        createRole() {
          this.roleDraft = this.createDefaultRole();
          this.editingRoleId = '';
          this.$refs.roleDialog.showModal();
        },
        newChat() {
          this.interruptAiPlayback();
          this.holdActive = false;
          this.stopMic({ sendEnd: false, force: true });
          this.ws?.close(1000, 'New chat');
          this.messageGroups = [];
          this.setSessionStatus('idle');
          this.drawerOpen = false;
        },
        selectRoleById(roleId) {
          this.editingRoleId = '';
          this.saveSelectRoleId(roleId);
          this.newChat();
        },
        openRoleConfig(roleId = this.selectedRoleId) {
          this.editingRoleId = roleId;
          this.roleDraft = { ...this.getConfigById(roleId) };
          this.$refs.roleDialog.showModal();
        },
        enterCallMode(roleId = this.selectedRoleId) {
          if (roleId !== this.selectedRoleId) this.selectRoleById(roleId);
          this.precheckMic().then((ok) => {
            if (!ok) return;
            this.uiMode = 'call';
            this.drawerOpen = false;
            if (!this.isSessionActive) this.connect();
            this.startMic();
          });
        },
        exitCallMode() {
          this.uiMode = 'chat';
          this.holdActive = false;
          this.stopMic({ sendEnd: true, force: true });
        },
        toggleInputMode() {
          this.inputMode = this.inputMode === 'voice' ? 'text' : 'voice';
          localStorage.setItem('geminiInputMode', this.inputMode);
        },
        async prepareHoldRecord() {
          const ok = await this.precheckMic();
          if (!ok) return false;
          if (!this.holdActive) return false;
          if (!this.canSendAudioNow()) return false;
          this.interruptAiPlayback();
          this.startMic();
          return true;
        },
        handleHoldRelease({ reason } = {}) {
          if (reason === 'timeout') toast.info('已达 15 秒上限，已自动发送');
          this.sendRecord();
          this.stopMic({ sendEnd: false, force: true });
        },
        resizeTextInput(event) {
          const el = event.target;
          this.textStyleHeight = 'auto';
          nextTick(() => {
            this.textStyleHeight = `${Math.min(el.scrollHeight, 120)}px`;
          });
        },
        handleTextKeydown(event) {
          if (event.key !== 'Enter' || (!event.metaKey && !event.ctrlKey)) return;
          event.preventDefault();
          this.sendText();
        },
        createDefaultRole() {
          return { ...this.defaultConfig, id: `role-${Date.now()}` };
        },
        getRoleById(roleId) {
          return this.allRoles.find((role) => role.id === roleId) || this.allRoles[0];
        },
        normalizeRole(role) {
          const normalized = { ...this.defaultConfig, ...role };
          normalized.id ||= `role-${Date.now()}`;
          normalized.name = (normalized.name || this.defaultConfig.name).trim();
          return normalized;
        },
        loadUserRoles() {
          try {
            const roles = JSON.parse(localStorage.getItem('geminiRoles') || '[]').map((role) => this.normalizeRole(role));
            if (roles.length) return roles;
          } catch {}
          return [];
        },
        saveRoles() { localStorage.setItem('geminiRoles', JSON.stringify(this.roles)); },
        saveSelectRoleId(selectedRoleId) { this.selectedRoleId = selectedRoleId; localStorage.setItem('geminiSelectedRoleId', selectedRoleId); },
        getConfigById(roleId) {
          return this.getRoleById(roleId);
        },
        loadCachedToolDeclarations() {
          try {
            const cachedTools = JSON.parse(localStorage.getItem(TOOL_CACHE_KEY) || '[]');
            return this.mergeToolDeclarations(browserTools.declarations, Array.isArray(cachedTools) ? cachedTools : []);
          } catch {
            return this.mergeToolDeclarations(browserTools.declarations);
          }
        },
        mergeToolDeclarations(...toolGroups) {
          const toolMap = new Map();
          toolGroups.flat().filter(Boolean).forEach((tool) => {
            if (tool?.name && !toolMap.has(tool.name)) toolMap.set(tool.name, tool);
          });
          return [...toolMap.values()];
        },
        async loadToolDeclarations({ force = false } = {}) {
          if (this.toolsLoading) return;
          this.toolsLoading = true;
          try {
            const response = await fetch('/api/tools');
            const data = await response.json();
            if (Array.isArray(data.tools)) {
              this.toolDeclarations = this.mergeToolDeclarations(browserTools.declarations, data.tools);
              localStorage.setItem(TOOL_CACHE_KEY, JSON.stringify(this.toolDeclarations));
            }
            if (data.error) console.warn('Load MCP tools failed:', data.error);
          } catch (error) {
            console.warn('Load tools failed:', error);
          } finally {
            this.toolsLoading = false;
          }
        },
        refreshToolDeclarations() { this.loadToolDeclarations(); },
        selectedToolNames() {
          const value = (this.roleDraft.autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return this.toolDeclarations.map((tool) => tool.name);
          return value.split(',').map((name) => name.trim()).filter(Boolean);
        },
        updateSelectedTools(names) {
          const uniqueNames = names.filter((name, index) => name && names.indexOf(name) === index);
          this.roleDraft.autoLoadTools = uniqueNames.join(',');
        },
        isToolSelected(name) { return this.selectedToolNames().includes(name); },
        toggleTool(name) {
          const names = this.selectedToolNames();
          this.updateSelectedTools(names.includes(name) ? names.filter((item) => item !== name) : [...names, name]);
        },
        setAllTools() { this.roleDraft.autoLoadTools = '*'; },
        clearTools() { this.roleDraft.autoLoadTools = ''; },
        saveRoleConfig() {
          const isCreatingRole = !this.editingRoleId;
          const targetRoleId = isCreatingRole ? this.roleDraft.id : this.editingRoleId;
          const isSystemRole = !isCreatingRole && this.default_roles.some((role) => role.id === targetRoleId);
          const sourceRole = this.getRoleById(targetRoleId);
          const baseName = (this.roleDraft.name || sourceRole.name).trim() || '未命名角色';
          const name = isSystemRole && !baseName.includes('自定义')
            ? `${baseName}（自定义）`
            : baseName;
          const roleId = isCreatingRole || isSystemRole ? `role-${Date.now()}` : targetRoleId;
          const role = this.normalizeRole({ ...this.roleDraft, id: roleId, name });
          const index = this.roles.findIndex((item) => item.id === role.id);
          if (index >= 0) this.roles.splice(index, 1, role);
          else this.roles.push(role);
          this.editingRoleId = role.id;
          this.saveSelectRoleId(role.id);
          this.saveRoles();
          this.closeRoleConfig();
        },
        confirmDeleteRole() {
          if (!this.canDeleteRole) return;
          const targetRoleId = this.editingRoleId || this.selectedRoleId;
          this.pendingDeleteRole = this.roles.find((role) => role.id === targetRoleId);
          this.$refs.deleteDialog.showModal();
        },
        closeDeleteDialog() { this.$refs.deleteDialog.close(); },
        closeDeleteOnBackdrop(event) { if (event.target === this.$refs.deleteDialog) this.closeDeleteDialog(); },
        deleteRole() {
          if (!this.pendingDeleteRole) return;
          const deletingActiveRole = this.pendingDeleteRole.id === this.selectedRoleId;
          if (deletingActiveRole && this.isSessionActive) this.ws?.close(1000, 'Deleted active role');
          const index = this.roles.findIndex((role) => role.id === this.pendingDeleteRole.id);
          if (index < 0) return;
          const [deletedRole] = this.roles.splice(index, 1);
          const selectedRoleId = this.allRoles[0].id;
          this.roleDraft = { ...this.getConfigById(selectedRoleId) };
          this.editingRoleId = '';
          this.saveRoles();
          this.saveSelectRoleId(selectedRoleId);
          this.closeDeleteDialog();
          this.closeRoleConfig();
          this.pendingDeleteRole = null;
        },
        closeRoleConfig() { this.$refs.roleDialog.close(); },
        closeRoleConfigOnBackdrop(event) {
          if (event.target === this.$refs.roleDialog) {
            this.editingRoleId = '';
            this.closeRoleConfig();
          }
        },
        setSessionStatus(next) {
          this.sessionStatus = next;
        },
        isWebSocketOpen() {
          return this.ws?.readyState === WebSocket.OPEN;
        },
        canSendAudioNow() {
          // 什么时候能发送音频, 什么时候不能发送
          // 1. 如果当前WS未连接, 并且用户在长按说话时, 按住说话期间全部缓存
          //    此时音频数据在本地缓存 initialMessages 里
          //    等用户松开说话时, 连接 WS, 成功后, 发送 setup, 附带 initialMessages
          if (!this.isWebSocketOpen() && this.holdActive && this.uiMode !== 'call' && this.inputMode === 'voice') return true;
          // 2. 其他情况下, 发送音频数据, 必须要等到 session 准备好之后才行
          if (!this.isSessionReady) return false;
          if (this.holdActive) return true;
          if (this.uiMode !== 'call') return false;
          if (this.callAudioMode === 'mute') return false;
          if (this.callAudioMode === 'turn' && this.callTurnOwner !== 'user') return false;
          if (this.callAudioMode === 'turn' && this.audioService?.hasQueuedPlayback()) return false;
          return true;
        },
        stopAiAudioPlayback() {
          this.audioService?.stopAiAudioPlayback();
        },
        syncPlaybackVolume() {
          this.audioService?.syncPlaybackVolume();
        },
        interruptAiPlayback() {
          this.stopAiAudioPlayback();
          this.aiAudioScheduledThisTurn = false;
          this.pendingAiCaption = '';
          this.pendingAiMessageId = '';
          this.callTurnOwner = 'user';
        },
        toggleCallAudioMode() {
          const order = ['free', 'turn', 'mute'];
          const idx = order.indexOf(this.callAudioMode);
          this.callAudioMode = order[(idx + 1) % order.length];
          localStorage.setItem('geminiCallAudioMode', this.callAudioMode);
        },
        toggleCallVideo() {
          if (this.callMediaMode === 'video') this.stopCallMedia();
          else this.startCallMedia('camera');
        },
        toggleCallScreenShare() {
          if (this.callMediaMode === 'screen') this.stopCallMedia();
          else this.startCallMedia('screen');
        },
        startCallMedia(source) {
          if (!this.mediaService || this.mediaStarting) return;
          this.mediaStarting = true;
          this.mediaService.start(source)
            .then(() => {
              this.callMediaMode = source === 'camera' ? 'video' : 'screen';
              if (source === 'camera') this.cameraFacing = this.mediaService.getCameraFacingMode();
              return source === 'camera' ? nextTick() : null;
            })
            .then(() => {
              this.mediaService.setDisplayElement(source === 'camera' ? (this.$refs.callVideoEl || null) : null);
            })
            .catch((err) => {
              this.callMediaMode = 'none';
              this.mediaService.setDisplayElement(null);
              this.showMediaError(err, source);
            })
            .finally(() => {
              this.mediaStarting = false;
            });
        },
        showMediaError(err, source) {
          const name = err?.name || '';
          if (name === 'InsecureContextError') {
            toast.error('需要 HTTPS 或 localhost', { description: '浏览器要求安全上下文才能使用摄像头/屏幕分享' });
          } else if (name === 'NotSupportedError') {
            toast.error('当前浏览器不支持', { description: err.message || '' });
          } else if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            if (source === 'camera') toast.error('摄像头未授权', { description: '请在浏览器设置中允许摄像头权限后重试' });
          } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError') {
            toast.error(source === 'camera' ? '未检测到摄像头' : '未检测到可分享屏幕');
          } else if (name === 'NotReadableError' || name === 'TrackStartError') {
            toast.error(source === 'camera' ? '摄像头被占用' : '屏幕分享启动失败');
          } else if (name === 'AbortError') {
            // user cancelled the screen-share picker — silent
          } else {
            toast.error(source === 'camera' ? '摄像头启动失败' : '屏幕分享启动失败', { description: err?.message || '请稍后重试' });
          }
        },
        stopCallMedia() {
          this.mediaService?.setDisplayElement(null);
          this.mediaService?.stop();
          this.callMediaMode = 'none';
        },
        switchCallCamera() {
          if (!this.mediaService || this.mediaStarting || this.callMediaMode !== 'video') return;
          this.mediaStarting = true;
          this.mediaService.switchCamera()
            .then(() => {
              this.cameraFacing = this.mediaService.getCameraFacingMode();
            })
            .catch((err) => {
              this.cameraFacing = this.mediaService.getCameraFacingMode();
              if (!this.mediaService.getActiveSource()) {
                this.callMediaMode = 'none';
                this.mediaService.setDisplayElement(null);
              }
              this.showMediaError(err, 'camera');
            })
            .finally(() => {
              this.mediaStarting = false;
            });
        },
        toggleVoiceEnabled() {
          this.voiceEnabled = !this.voiceEnabled;
          localStorage.setItem('geminiVoiceEnabled', JSON.stringify(this.voiceEnabled));
          this.syncPlaybackVolume();
        },
        setupMessage() {
          const setup = {
            model: this.currentRole.model,
            generationConfig: { },
            systemInstruction: { parts: [{ text: this.currentRole.systemInstruction }] },
          };
          if (this.currentRole.voiceName) setup.generationConfig.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: this.currentRole.voiceName } } };
          setup.autoLoadTools = this.currentRole.autoLoadTools || '';
          const browserToolNames = this.selectedBrowserToolNames(setup.autoLoadTools);
          const browserToolDeclarations = browserTools.declarations.filter((tool) => browserToolNames.includes(tool.name));
          if (browserToolDeclarations.length) setup.tools = [{ functionDeclarations: browserToolDeclarations }];
          if (this.pendingClientPayloads.length) {
            setup.initialMessages = this.pendingClientPayloads;
            this.pendingClientPayloads = [];
          }
          return { setup };
        },
        selectedBrowserToolNames(autoLoadTools) {
          const browserToolNames = browserTools.declarations.map((tool) => tool.name);
          const value = (autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return browserToolNames;
          const selectedNames = value.split(',').map((name) => name.trim()).filter(Boolean);
          return browserToolNames.filter((name) => selectedNames.includes(name));
        },
        async handleBrowserToolCalls(functionCalls) {
          const functionResponses = [];
          for (const call of functionCalls) {
            const { id, name, args } = call;
            const startedAt = Date.now();
            TOOL_EVENTS.upsertToolMessage(this.messageGroups, { id, name, kind: 'browser', status: 'running', args: args ?? null, startedAt });
            const handler = browserTools.handlers?.[name];
            let response;
            if (!handler) {
              response = { error: `Unknown browser tool: ${name}` };
              TOOL_EVENTS.upsertToolMessage(this.messageGroups, { id, name, kind: 'browser', status: 'error', args: args ?? null, error: response.error, startedAt, endedAt: Date.now() });
            } else {
              try {
                response = await handler(args || {});
                TOOL_EVENTS.upsertToolMessage(this.messageGroups, { id, name, kind: 'browser', status: 'done', args: args ?? null, response, startedAt, endedAt: Date.now() });
              } catch (error) {
                response = { error: error.message || String(error) };
                TOOL_EVENTS.upsertToolMessage(this.messageGroups, { id, name, kind: 'browser', status: 'error', args: args ?? null, error: response.error, startedAt, endedAt: Date.now() });
              }
            }
            functionResponses.push({ id, name, response });
          }
          if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ toolResponse: { functionResponses } }));
        },
        openRenderedPage(message) {
          this.activeRenderPage = message;
          nextTick(() => {
            if (!this.$refs.renderDialog.open) this.$refs.renderDialog.showModal();
          });
        },
        closeRenderedPage() {
          this.$refs.renderDialog.close();
          this.activeRenderPage = null;
        },
        closeRenderedPageOnBackdrop(event) {
          if (event.target === this.$refs.renderDialog) this.closeRenderedPage();
        },
        async copyRenderSource(message) {
          if (!message?.html) return;
          const ok = await copyTextToClipboard(message.html);
          if (ok) {
            message.copyState = 'ok';
            toast.success('已复制源代码');
            setTimeout(() => { if (message.copyState === 'ok') message.copyState = ''; }, 1600);
          } else {
            toast.error('复制失败', { description: '请手动选择源代码后复制' });
          }
        },
        async connect() {
          if (this.isSessionActive) return;
          this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
          this.interruptAiPlayback();
          this.setSessionStatus('connecting');
          this.ws.onopen = async () => { await this.ensureAudio(); this.setSessionStatus('socket_open'); };
          this.ws.onmessage = (event) => {
            let payload;
            try {
              payload = JSON.parse(event.data);
            } catch (err) {
              console.warn('Failed to parse WS message:', err, event.data);
              return;
            }
            this.handleMessage(payload);
          };
          this.ws.onerror = () => this.setSessionStatus('error');
          this.ws.onclose = (event) => {
            this.interruptAiPlayback();
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
            this.setSessionStatus(event.code == 1000 ? 'session_closed' : 'socket_closed');
            if (this.uiMode === 'call') this.uiMode = 'chat';
          };
        },
        handleMessage(msg) {
          if (msg.systemContent) {
            this.handleSystemContent(msg.systemContent);
            return;
          }
          if (msg.workerStatus) {
            if (msg.workerStatus.type === 'gemini_close') this.ws?.close(1000, 'User disconnected');
            if (msg.workerStatus.type === 'gemini_open') {
              this.setSessionStatus('session_open');
              this.ws.send(JSON.stringify(this.setupMessage()));
            }
            if (msg.workerStatus.type === 'session_reconnect' || msg.workerStatus.type === 'session_resuming') {
              this.setSessionStatus('session_reconnecting');
            }
            if (msg.workerStatus.type === 'session_reconnected') {
              this.setSessionStatus('session_reconnecting');
            }
            return;
          }
          if (msg.setupComplete) {
            this.setSessionStatus('session_ready');
            this.sendRealtimeInputs();
            this.callTurnOwner = 'user';
            if (this.uiMode === 'call' && this.callAudioMode !== 'mute') this.playReadyTone({ type: 'triangle'});
            return;
          }
          const browserFunctionCalls = (msg.toolCall?.functionCalls || []).filter((call) => browserTools.handlers?.[call.name]);
          if (browserFunctionCalls.length) {
            this.closeAiTextSegment();
            this.handleBrowserToolCalls(browserFunctionCalls);
            return;
          }
          const content = msg.serverContent;
          if (!content) return;
          if (content.interrupted) {
            this.interruptAiPlayback();
            this.aiAudioScheduledThisTurn = false;
            this.pendingAiMessageId = '';
            return;
          }
          if (!!content.outputTranscription?.text || !!content.modelTurn?.parts?.length) this.callTurnOwner = 'model';
          if (content.inputTranscription?.text) {
            this.closeAiTextSegment();
            this.addTranscript('user', content.inputTranscription.text);
          }
          if (content.outputTranscription?.text) {
            this.ensureAiTextSegment();
            this.addTranscript('Gemini', content.outputTranscription.text, this.pendingAiMessageId);
            this.pendingAiCaption += content.outputTranscription.text;
          }
          for (const part of content.modelTurn?.parts || []) {
            if (part.text) {
              if (part.thought) {
                this.closeAiTextSegment();
                this.addThought(part.text);
              } else {
                this.ensureAiTextSegment();
                this.addTranscript('Gemini', part.text, this.pendingAiMessageId);
                this.pendingAiCaption += part.text;
              }
            }
            if (part.inlineData?.data) {
              this.aiAudioScheduledThisTurn = true;
              this.playPcm(part.inlineData.data, part.inlineData.mimeType, this.pendingAiCaption, this.pendingAiMessageId);
            }
          }
          if (content.turnComplete) {
            this.pendingAiCaption = '';
            this.pendingAiMessageId = '';
            this.aiAudioScheduledThisTurn = false;
            this.callTurnOwner = 'user';
            if (this.uiMode === 'call' && this.callAudioMode === 'turn') {
              this.playReadyTone({ queued: true });
            }
          }
        },
        handleSystemContent(systemContent) {
          const toolCall = systemContent?.toolCall;
          if (!toolCall) return;
          this.closeAiTextSegment();
          TOOL_EVENTS.upsertToolMessage(this.messageGroups, toolCall);
          this.scrollChatToBottom();
        },
        toolDisplayName(name) { return TOOL_EVENTS.displayName(name); },
        toolStatusText(status) { return TOOL_EVENTS.statusText(status); },
        scrollChatToBottom() {
          nextTick(() => {
            const el = this.$refs.chatEl;
            if (el) el.scrollTop = el.scrollHeight;
          });
        },
        ensureAiTextSegment() {
          if (!this.pendingAiMessageId) this.pendingAiMessageId = `ai-msg-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          return this.pendingAiMessageId;
        },
        closeAiTextSegment() {
          this.pendingAiCaption = '';
          this.pendingAiMessageId = '';
        },
        addThought(text) {
          if (!text) return;
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === 'Gemini' && lastItem.message?.type === 'thought') {
            lastItem.message.text += text;
            nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
            return;
          }
          this.addMessage('Gemini', { type: 'thought', text, title: '思考过程' });
        },
        addCaption(role, text, messageId = '') {
          if (!text) return;
          if (messageId) {
            const target = this.findMessageById(messageId);
            if (target?.role === role && target.message?.type === 'text') {
              target.message.caption = text;
              this.scrollCallCaptions();
              return;
            }
            this.addMessage(role, text, messageId);
            return;
          }
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === role && lastItem.message?.type === 'text') {
            lastItem.message.caption = text;
            this.scrollCallCaptions();
            return;
          }
          this.addMessage(role, text, messageId);
        },
        addTranscript(role, text, messageId = '') {
          if (!text) return;
          if (messageId) {
            const target = this.findMessageById(messageId);
            if (target?.role === role && target.message?.type === 'text') {
              target.message.text += text;
              nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
              this.scrollCallCaptions();
              return;
            }
            this.addMessage(role, text, messageId);
            return;
          }
          const lastItem = this.messageGroups.at(-1);
          if (lastItem?.role === role && lastItem.message?.type === 'text') {
            lastItem.message.text += text;
            nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
            this.scrollCallCaptions();
            return;
          }
          this.addMessage(role, text, messageId);
        },
        addMessage(role, content, messageId = '') {
          const message = typeof content === 'string' ? { type: 'text', text: content, caption: '' } : content;
          if (!message || (message.type === 'text' && !message.text)) return;
          if (messageId && !message.id) message.id = messageId;
          if (!message.id) message.id = `${role}-${Date.now()}-${Math.random().toString(36).slice(2, 8)}`;
          this.messageGroups.push({ role, message });
          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
          this.scrollCallCaptions();
        },
        scrollCallCaptions() {
          nextTick(() => {
            const el = this.$refs.callCaptionEl;
            if (el) el.scrollTop = el.scrollHeight;
          });
        },
        startWaveLoop() {
          if (this.waveRafId !== null) return;
          const tick = () => {
            if (this.audioService) {
              this.aiWaveBars = this.audioService.getAiWaveform(5);
              this.userWaveBars = this.audioService.getUserWaveform(5);
            }
            this.waveRafId = requestAnimationFrame(tick);
          };
          this.waveRafId = requestAnimationFrame(tick);
        },
        stopWaveLoop() {
          if (this.waveRafId !== null) {
            cancelAnimationFrame(this.waveRafId);
            this.waveRafId = null;
          }
          this.aiWaveBars = [0, 0, 0, 0, 0];
          this.userWaveBars = [0, 0, 0, 0, 0];
        },
        async ensureAudio() {
          await this.audioService?.ensureAudio();
        },
        async playReadyTone(options = {}) {
          await this.audioService?.playReadyTone(options);
        },
        async playPcm(data, mime = 'audio/pcm;rate=24000', caption = "", messageId = '') {
          await this.audioService?.playPcm(data, mime, caption, messageId);
        },
        findMessageById(messageId) {
          if (!messageId) return null;
          for (let index = this.messageGroups.length - 1; index >= 0; index -= 1) {
            const item = this.messageGroups[index];
            if (item?.message?.id === messageId) return item;
          }
          return null;
        },
        async precheckMic() {
          try {
            await this.audioService?.checkMicAvailable();
            return true;
          } catch (err) {
            this.showMicError(err);
            return false;
          }
        },
        showMicError(error) {
          const name = error?.name || '';
          if (name === 'InsecureContextError') {
            toast.error('当前页面非安全上下文', { description: '请通过 HTTPS 或 localhost 访问才能使用麦克风' });
          } else if (name === 'NotAllowedError' || name === 'SecurityError' || name === 'PermissionDeniedError') {
            toast.error('麦克风未授权', { description: '请在浏览器设置中允许麦克风权限后重试' });
          } else if (name === 'NotFoundError' || name === 'DevicesNotFoundError' || name === 'OverconstrainedError') {
            toast.error('未检测到麦克风', { description: '请检查麦克风是否连接' });
          } else if (name === 'NotReadableError' || name === 'TrackStartError') {
            toast.error('麦克风被占用', { description: '请关闭其他正在使用麦克风的应用后重试' });
          } else if (name === 'NotSupportedError') {
            toast.error('当前浏览器不支持麦克风');
          } else {
            toast.error('麦克风启动失败', { description: error?.message || '请稍后重试' });
          }
        },
        async startMic() {
          if (this.micStatus !== 'idle') return;
          this.micStatus = 'starting';
          try {
            const started = await this.audioService?.startMic();
            if (!started) throw new Error('mic not started');
            this.micStatus = 'recording';
          } catch (error) {
            this.micStatus = 'idle';
            this.showMicError(error);
            this.handleMicEnded();
          }
        },
        stopMic(options = {}) {
          const { sendEnd = true, force = false } = options;
          if (!force && this.holdActive) return;
          const wasRecording = this.micStatus === 'recording';
          if (sendEnd && wasRecording && this.isSessionActive && this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          this.audioService?.stopMic();
          this.micStatus = 'idle';
        },
        handleMicEnded() {
          if (this.uiMode === 'call') {
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
            this.uiMode = 'chat';
          } else if (this.holdActive) {
            this.holdActive = false;
            this.stopMic({ sendEnd: false, force: true });
          }
        },
        sendText() {
          const value = this.text.trim();
          if (!value) return;
          this.pendingClientPayloads.push({
            clientContent: {
              turns: [{ role: 'user', parts: [{ text: value }] }],
              turnComplete: true,
            },
          });
          this.sendRealtimeInputs();
          this.closeAiTextSegment();
          this.addMessage('user', value);
          this.text = '';
          this.textStyleHeight = '48px';
        },
        sendRecord() {
          const hasAudioMessage = this.pendingClientPayloads?.some(item => item.realtimeInput && item.realtimeInput.audio);
          if (!hasAudioMessage) return;
          this.pendingClientPayloads.push({ realtimeInput: { audioStreamEnd: true } });
          this.sendRealtimeInputs();
        },
        sendRealtimeInputs() {
          if (this.pendingClientPayloads.length <= 0) return;
          if (this.isSessionReady) {
            this.interruptAiPlayback();
            this.pendingClientPayloads.forEach(input => {
              this.ws.send(JSON.stringify(input));
            });
            this.pendingClientPayloads = [];
            return;
          }
          if (!this.isWebSocketOpen()) {
            this.connect();
            return;
          }
        },
      },
    });

    const lucideComponents = {
      'audio-lines-icon': AudioLines,
      'captions-icon': Captions,
      'captions-off-icon': CaptionsOff,
      'check-icon': Check,
      'copy-icon': Copy,
      'keyboard-icon': Keyboard,
      'maximize-2-icon': Maximize2,
      'menu-icon': Menu,
      'message-circle-plus-icon': MessageCirclePlus,
      'mic-icon': Mic,
      'mic-off-icon': MicOff,
      'monitor-icon': Monitor,
      'moon-icon': Moon,
      'panel-left-close-icon': PanelLeftClose,
      'phone-icon': Phone,
      'phone-off-icon': PhoneOff,
      'repeat-icon': Repeat,
      'screen-share-icon': ScreenShare,
      'screen-share-off-icon': ScreenShareOff,
      'send-icon': Send,
      'settings-icon': Settings,
      'settings-2-icon': Settings2,
      'sparkles-icon': Sparkles,
      'square-icon': Square,
      'sun-icon': Sun,
      'switch-camera-icon': SwitchCamera,
      'user-plus-icon': UserPlus,
      'video-icon': Video,
      'video-off-icon': VideoOff,
      'volume-2-icon': Volume2,
      'volume-x-icon': VolumeX,
      'x-icon': X,
    };
    Object.entries(lucideComponents).forEach(([name, component]) => app.component(name, component));
    app.component('progressive-text', ProgressiveText);
    app.component('hold-record', HoldRecord);
    app.component('toaster', Toaster);
    app.mount('#app');
    document.body.classList.add('app-ready');
    const bootScreen = document.getElementById('boot-screen');
    if (bootScreen) bootScreen.classList.add('hidden');
  </script>
</body>
</html>
