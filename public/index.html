<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini 语音对话</title>
  <style>
    :root { color-scheme: dark; --bg:#080b13; --panel:rgba(255,255,255,.08); --line:rgba(255,255,255,.14); --text:#f7f8ff; --muted:#aab2c8; --brand:#7c5cff; --ok:#38d996; --warn:#ffca5c; --bad:#ff6b7a; }
    * { box-sizing: border-box; } body { margin:0; height:100dvh; overflow:hidden; display:grid; place-items:center; font:16px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 20% 10%,#4530a8 0 18rem,transparent 32rem),radial-gradient(circle at 80% 20%,#0b7b86 0 16rem,transparent 31rem),var(--bg); }
    #app { width:100%; height:100%; } main { width:min(768px,100%); height:100dvh; margin:0 auto; padding:28px; display:grid; gap:18px; grid-template-rows:auto minmax(0,1fr) auto; }
    header, .card, form { border:1px solid var(--line); background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06)); box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(24px); border-radius:28px; }
    header { min-height:68px; padding:10px 14px 10px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-radius:24px; } .titlebar-title { min-width:0; } .role-select { min-width:min(360px,48vw); min-height:48px; font-size:20px; font-weight:750; letter-spacing:-.03em; } .role-select .new-role { color:var(--brand); font-weight:800; } p { margin:.15rem 0 0; color:var(--muted); font-size:14px; } .titlebar-actions { display:flex; align-items:center; gap:10px; } .dot { width:15px; height:15px; border-radius:99px; background:var(--bad); box-shadow:0 0 22px currentColor; } .dot.ok { background:var(--ok); } .dot.wait { background:var(--warn); } .status-dot { position:absolute; top:-3px; right:-3px; border:2px solid rgba(42,35,100,.95); }
    .card { min-height:0; padding:20px; overflow:hidden; position:relative; display:grid; grid-template-rows:minmax(0,1fr); } .view-toggle { position:absolute; top:14px; right:14px; z-index:2; background:rgba(255,255,255,.12); border:1px solid var(--line); } #chat { min-height:0; overflow:auto; padding:4px 56px 4px 4px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; } .group { max-width:82%; display:flex; flex-direction:column; gap:4px; animation:pop .18s ease-out; } .group.user { align-self:flex-end; align-items:flex-end; } .group.ai { align-self:flex-start; align-items:flex-start; } .role { padding:0 6px; font-size:12px; color:rgba(255,255,255,.68); } .msg { padding:10px 14px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.08); white-space:pre-wrap; } .user .msg { background:linear-gradient(135deg,var(--brand),#23b8d5); } .group .msg + .msg { margin-top:0; } .live { min-height:0; overflow:auto; padding:64px 20px 20px; border-radius:20px; border:1px var(--line); color:var(--text); font-size:clamp(24px,4vw,44px); line-height:1.35; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; white-space:pre-wrap; } .live-role { font-size:14px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; } .live-body { max-width:100%; } .live-user { color:#56e5ff; } .live-ai { color:#bba9ff; } .live-status { color:var(--warn); } .live-waiting { color:var(--muted); } .wait-icon { display:inline-block; font-size:clamp(48px,10vw,92px); animation:breathe 1.7s ease-in-out infinite; filter:drop-shadow(0 0 28px rgba(255,255,255,.22)); }
    form { padding:12px; display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between; gap:10px; } .input-wrap { flex:1 1 auto; min-width:120px; } .actions { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; } input, textarea, select { width:100%; min-height:48px; border:1px solid var(--line); border-radius:18px; padding:0 16px; color:var(--text); background:rgba(0,0,0,.25); outline:none; font:inherit; } textarea { min-height:120px; padding:12px 16px; resize:vertical; } button { flex:0 0 auto; min-width:48px; min-height:48px; border:0; border-radius:18px; padding:0 14px; color:white; background:linear-gradient(135deg,var(--brand),#15c8b7); font-size:20px; font-weight:750; cursor:pointer; transition:.2s transform,.2s opacity; } button:hover { transform:translateY(-1px); } button:disabled { opacity:.45; cursor:not-allowed; transform:none; } #mic.recording { background:linear-gradient(135deg,#ff477e,#ff9f43); } #connect { position:relative; } #connect.off { background:linear-gradient(135deg,#ff477e,#ff9f43); } .ghost { background:rgba(255,255,255,.12); border:1px solid var(--line); } dialog { width:min(680px,calc(100% - 24px)); border:1px solid var(--line); border-radius:28px; padding:0; color:var(--text); background:rgba(12,16,28,.96); box-shadow:0 28px 90px rgba(0,0,0,.55); backdrop-filter:blur(24px); } dialog::backdrop { background:rgba(0,0,0,.58); backdrop-filter:blur(6px); } .modal { padding:22px; display:grid; gap:16px; } .modal h2 { margin:0; font-size:24px; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:grid; gap:7px; color:var(--muted); font-size:13px; } label.full { grid-column:1/-1; } .modal-actions { display:flex; justify-content:flex-end; gap:10px; }
    @keyframes pop { from { transform:translateY(6px); opacity:0; } } @keyframes breathe { 0%,100% { transform:scale(.92); opacity:.48; } 50% { transform:scale(1.08); opacity:1; } } @media (max-width:700px) { main{padding:12px} header{padding:10px; gap:10px}.titlebar-title p{display:none}.titlebar-actions{gap:8px}.group{max-width:94%}.grid{grid-template-columns:1fr} }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <header>
        <div class="titlebar-title">
          <select class="role-select" v-model="selectedRoleId" @change="selectRole">
            <option class="new-role" value="__new__">＋ 新建角色</option>
            <option v-for="role in roles" :key="role.id" :value="role.id">{{ role.name }}</option>
          </select>
        </div>
        <div class="titlebar-actions">
          <button id="connect" type="button" :title="statusText" :class="{ off: connected }" :disabled="connecting" @click="toggleConnection"><span class="dot status-dot" :class="statusKind"></span>{{ connected ? '⏻' : '🔌' }}</button>
          <button class="ghost" type="button" title="配置" @click="openSettings">⚙️</button>
        </div>
      </header>

      <section class="card">
        <button class="view-toggle" type="button" :title="viewMode === 'chat' ? '切换到字幕' : '切换到消息'" @click="toggleViewMode">{{ viewMode === 'chat' ? '💬' : '🗯️' }}</button>
        <div id="chat" ref="chatEl" v-show="viewMode === 'chat'">
          <div v-for="(group, index) in messageGroups" :key="index" class="group" :class="group.role === '我' ? 'user' : 'ai'">
            <div class="role">{{ group.role }}</div>
            <div v-for="(message, messageIndex) in group.messages" :key="messageIndex" class="msg">{{ message }}</div>
          </div>
        </div>
        <div class="live" :class="`live-${caption.kind}`" v-show="viewMode === 'caption'">
          <template v-if="caption.kind === 'waiting'">
            <span class="wait-icon" aria-label="等待用户输入">{{ caption.icon }}</span>
          </template>
          <template v-else>
            <div class="live-role">{{ caption.role }}</div>
            <div class="live-body">{{ caption.text }}</div>
          </template>
        </div>
      </section>

      <form @submit.prevent="sendText">
        <div class="input-wrap"><input v-model="text" autocomplete="off" placeholder="输入消息，或使用麦克风实时说话…" /></div>
        <div class="actions">
          <button id="mic" type="button" title="按住说话" :class="{ recording }" :disabled="!connected" @pointerdown="startMic" @pointerup="stopMic" @pointercancel="stopMic" @pointerleave="stopMicIfRecording">{{ recording ? '🛑' : '🎙️' }}</button>
          <button type="submit" title="发送" :disabled="!connected">➤</button>
        </div>
      </form>
    </main>

    <dialog ref="settingsDialog" @click="closeSettingsOnBackdrop">
      <div class="modal">
        <div><h2>会话配置</h2></div>
        <div class="grid">
          <label class="full">角色名<input v-model="draftConfig.roleName" placeholder="例如：中文助理" /></label>
          <label>模型<select v-model="draftConfig.model">
            <option v-for="model in models" :key="model.value" :value="model.value">
              {{ model.name }}
            </option>
          </select></label>
          <label>语音<select v-model="draftConfig.voiceName">
            <option v-for="voice in voices" :key="voice.name" :value="voice.name === 'No Voice' ? '' : voice.name">
              {{ voice.name }} - {{ voice.characteristics }}
            </option>
          </select></label>
          <label>响应类型<select v-model="draftConfig.responseModality"><option value="AUDIO">AUDIO</option><option value="TEXT">TEXT</option></select></label>
          <label class="full">系统提示词<textarea v-model="draftConfig.systemInstruction"></textarea></label>
        </div>
        <div class="modal-actions">
          <button class="ghost" type="button" @click="closeSettings">取消</button>
          <button type="button" @click="saveSettings">保存</button>
        </div>
      </div>
    </dialog>
  </div>

  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, nextTick } = Vue;

    const models = [
      {
        "name": "Gemini 3.1 Flash Live Preview",
        "value": "models/gemini-3.1-flash-live-preview"
      },
      {
        "name": "Gemini 2.5 Flash Native Preview",
        "value": "models/gemini-2.5-flash-native-audio-preview-12-2025"
      }
    ]

    const voices = [
      {
        "name": "No Voice",
        "characteristics": "Default"
      },
      {
        "name": "Zephyr",
        "characteristics": "Bright, Higher pitch"
      },
      {
        "name": "Puck",
        "characteristics": "Upbeat, Middle pitch"
      },
      {
        "name": "Charon",
        "characteristics": "Informative, Lower pitch"
      },
      {
        "name": "Kore",
        "characteristics": "Firm, Middle pitch"
      },
      {
        "name": "Fenrir",
        "characteristics": "Excitable, Lower middle pitch"
      },
      {
        "name": "Leda",
        "characteristics": "Youthful, Higher pitch"
      },
      {
        "name": "Orus",
        "characteristics": "Firm, Lower middle pitch"
      },
      {
        "name": "Aoede",
        "characteristics": "Breezy, Middle pitch"
      },
      {
        "name": "Callirrhoe",
        "characteristics": "Easy-going, Middle pitch"
      },
      {
        "name": "Autonoe",
        "characteristics": "Bright, Middle pitch"
      },
      {
        "name": "Enceladus",
        "characteristics": "Breathy, Lower pitch"
      },
      {
        "name": "Iapetus",
        "characteristics": "Clear, Lower middle pitch"
      },
      {
        "name": "Umbriel",
        "characteristics": "Easy-going, Lower middle pitch"
      },
      {
        "name": "Algieba",
        "characteristics": "Smooth, Lower pitch"
      },
      {
        "name": "Despina",
        "characteristics": "Smooth, Middle pitch"
      },
      {
        "name": "Erinome",
        "characteristics": "Clear, Middle pitch"
      },
      {
        "name": "Algenib",
        "characteristics": "Gravelly, Lower pitch"
      },
      {
        "name": "Rasalgethi",
        "characteristics": "Informative, Middle pitch"
      },
      {
        "name": "Laomedeia",
        "characteristics": "Upbeat, Higher pitch"
      },
      {
        "name": "Achernar",
        "characteristics": "Soft, Higher pitch"
      },
      {
        "name": "Alnilam",
        "characteristics": "Firm, Lower middle pitch"
      },
      {
        "name": "Schedar",
        "characteristics": "Even, Lower middle pitch"
      },
      {
        "name": "Gacrux",
        "characteristics": "Mature, Middle pitch"
      },
      {
        "name": "Pulcherrima",
        "characteristics": "Forward, Middle pitch"
      },
      {
        "name": "Achird",
        "characteristics": "Friendly, Lower middle pitch"
      },
      {
        "name": "Zubenelgenubi",
        "characteristics": "Casual, Lower middle pitch"
      },
      {
        "name": "Vindemiatrix",
        "characteristics": "Gentle, Middle pitch"
      },
      {
        "name": "Sadachbia",
        "characteristics": "Lively, Lower pitch"
      },
      {
        "name": "Sadaltager",
        "characteristics": "Knowledgeable, Middle pitch"
      },
      {
        "name": "Sulafat",
        "characteristics": "Warm, Middle pitch"
      }
    ];

    createApp({
      data() {
        const defaultConfig = {
          roleName: 'Gemini 语音对话',
          model: 'models/gemini-2.5-flash-native-audio-preview-12-2025',
          voiceName: 'Kore',
          systemInstruction: 'You are a concise, friendly Chinese voice assistant.',
          responseModality: 'AUDIO',
        };
        return {
          defaultConfig,
          models,
          voices,
          roles: [],
          selectedRoleId: '',
          config: defaultConfig,
          draftConfig: { ...defaultConfig },
          ws: null,
          audioCtx: null,
          playbackTime: 0,
          micStream: null,
          source: null,
          processor: null,
          connected: false,
          connecting: false,
          recording: false,
          statusText: '未连接',
          statusKind: '',
          caption: { kind: 'status', role: '状态', text: '点击 🔌 开始', icon: '💭' },
          viewMode: 'caption',
          text: '',
          messageGroups: [],
          inputDraft: '',
          outputDraft: '',
        };
      },
      mounted() {
        this.roles = this.loadRoles();
        this.selectedRoleId = localStorage.getItem('geminiSelectedRoleId') || this.roles[0]?.id || '';
        this.config = this.loadConfig();
        this.draftConfig = { ...this.config };
      },
      methods: {
        createDefaultRole() {
          return { ...this.defaultConfig, id: `role-${Date.now()}`, roleName: this.defaultConfig.roleName };
        },
        normalizeRole(role) {
          const normalized = { ...this.defaultConfig, ...role };
          normalized.id ||= `role-${Date.now()}`;
          normalized.roleName = (normalized.roleName || normalized.name || this.defaultConfig.roleName).trim();
          normalized.name = normalized.roleName;
          return normalized;
        },
        loadRoles() {
          try {
            const roles = JSON.parse(localStorage.getItem('geminiRoles') || '[]').map((role) => this.normalizeRole(role));
            if (roles.length) return roles;
          } catch {}
          let legacyConfig = {};
          try { legacyConfig = JSON.parse(localStorage.getItem('geminiSetupConfig') || '{}'); } catch {}
          const legacy = this.normalizeRole({ ...legacyConfig, id: `role-${Date.now()}` });
          localStorage.setItem('geminiRoles', JSON.stringify([legacy]));
          return [legacy];
        },
        saveRoles() { localStorage.setItem('geminiRoles', JSON.stringify(this.roles)); },
        loadConfig() {
          return { ...this.defaultConfig, ...(this.roles.find((role) => role.id === this.selectedRoleId) || this.roles[0] || {}) };
        },
        saveSettings() {
          const roleName = (this.draftConfig.roleName || '').trim() || '未命名角色';
          const role = this.normalizeRole({ ...this.draftConfig, id: this.selectedRoleId || `role-${Date.now()}`, roleName });
          const index = this.roles.findIndex((item) => item.id === role.id);
          if (index >= 0) this.roles.splice(index, 1, role);
          else this.roles.push(role);
          this.selectedRoleId = role.id;
          this.config = { ...role };
          this.saveRoles();
          localStorage.setItem('geminiSelectedRoleId', this.selectedRoleId);
          this.closeSettings();
          this.setCaption('status', '状态', `角色「${role.roleName}」已保存，下次连接时生效。`);
        },
        openSettings() { this.draftConfig = { ...this.loadConfig() }; this.$refs.settingsDialog.showModal(); },
        selectRole() {
          if (this.selectedRoleId === '__new__') {
            this.draftConfig = this.createDefaultRole();
            this.selectedRoleId = '';
            this.$refs.settingsDialog.showModal();
            return;
          }
          localStorage.setItem('geminiSelectedRoleId', this.selectedRoleId);
          this.config = this.loadConfig();
          this.draftConfig = { ...this.config };
          this.setCaption('status', '状态', `已切换到角色「${this.config.roleName}」。`);
        },
        closeSettings() { this.$refs.settingsDialog.close(); },
        closeSettingsOnBackdrop(event) { if (event.target === this.$refs.settingsDialog) this.closeSettings(); },
        setStatus(text, kind = '') { this.statusText = text; this.statusKind = kind; },
        setCaption(kind, role = '', text = '', icon = '💭') { this.caption = { kind, role, text, icon }; },
        showWaitingForUser() { this.setCaption('waiting', '', '', '💭'); },
        toggleViewMode() { this.viewMode = this.viewMode === 'chat' ? 'caption' : 'chat'; },
        setupMessage() {
          const setup = {
            model: this.config.model,
            generationConfig: {
              responseModalities: [this.config.responseModality],
            },
            systemInstruction: { parts: [{ text: this.config.systemInstruction }] },
          };
          if (this.config.responseModality === 'AUDIO' && this.config.voiceName) setup.generationConfig.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: this.config.voiceName } } };
          setup.inputAudioTranscription = {};
          setup.outputAudioTranscription = {};
          return { setup };
        },
        toggleConnection() { this.connected ? this.ws?.close(1000, 'User disconnected') : this.connect(); },
        async connect() {
          if (this.connected || this.connecting) return;
          this.config = this.loadConfig();
          this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
          this.connecting = true;
          this.setStatus('连接中…', 'wait');
          this.ws.onopen = async () => { this.connected = true; this.connecting = false; await this.ensureAudio(); this.setStatus('初始化…', 'wait'); this.setCaption('status', '状态', '正在初始化 Gemini Live 会话…'); };
          this.ws.onmessage = (event) => this.handleMessage(JSON.parse(event.data));
          this.ws.onerror = () => this.setStatus('连接错误');
          this.ws.onclose = () => { this.stopMic(); this.connected = false; this.connecting = false; this.setStatus('已断开'); this.setCaption('status', '状态', '已断开'); };
        },
        handleMessage(msg) {
          if (msg.workerStatus) {
            this.setCaption('status', '状态', msg.workerStatus.message);
            if (msg.workerStatus.type === 'gemini_open') this.ws.send(JSON.stringify(this.setupMessage()));
            return;
          }
          if (msg.setupComplete) { this.setStatus('已连接', 'ok'); this.showWaitingForUser(); return; }
          const content = msg.serverContent;
          if (!content) return;
          if (content.inputTranscription?.text) { this.setCaption('user', '我', `${this.inputDraft}${content.inputTranscription.text}`); this.addTranscript('我', content.inputTranscription.text); }
          if (content.outputTranscription?.text) { this.setCaption('ai', 'Gemini', `${this.outputDraft}${content.outputTranscription.text}`); this.addTranscript('Gemini', content.outputTranscription.text); }
          for (const part of content.modelTurn?.parts || []) {
            if (part.text) { this.setCaption('ai', 'Gemini', `${this.outputDraft}${part.text}`); this.addTranscript('Gemini', part.text); }
            if (part.inlineData?.data) this.playPcm(part.inlineData.data, part.inlineData.mimeType);
          }
          if (content.turnComplete) {
            this.addTranscript('我', '', true);
            this.addTranscript('Gemini', '', true);
            this.showWaitingForUser();
          }
        },
        addTranscript(role, text, flush = false) {
          const draftKey = role === '我' ? 'inputDraft' : 'outputDraft';
          const draft = this[draftKey] + text;
          const parts = draft.match(/[^。！？!?；;\n]+[。！？!?；;\n]+|[^。！？!?；;\n]+$/g) || [];
          const pending = !flush && parts.length && !/[。！？!?；;\n]$/.test(parts.at(-1)) ? parts.pop() : '';
          parts.forEach((part) => this.addMessage(role, part.trim()));
          this[draftKey] = pending;
        },
        addMessage(role, text) {
          if (!text.trim()) return;
          const lastGroup = this.messageGroups.at(-1);
          if (lastGroup?.role === role) lastGroup.messages.push(text.trim());
          else this.messageGroups.push({ role, messages: [text.trim()] });
          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
        },
        async ensureAudio() {
          this.audioCtx ||= new AudioContext();
          if (this.audioCtx.state !== 'running') await this.audioCtx.resume();
          this.playbackTime = Math.max(this.playbackTime, this.audioCtx.currentTime);
        },
        async playPcm(data, mime = 'audio/pcm;rate=24000') {
          await this.ensureAudio();
          const rate = +(mime.match(/rate=(\d+)/)?.[1] || 24000);
          const raw = atob(data);
          const samples = raw.length / 2;
          const buffer = this.audioCtx.createBuffer(1, samples, rate);
          const out = buffer.getChannelData(0);
          for (let i = 0; i < samples; i++) { const lo = raw.charCodeAt(i * 2), hi = raw.charCodeAt(i * 2 + 1); let value = (hi << 8) | lo; if (value & 0x8000) value -= 0x10000; out[i] = value / 32768; }
          const node = this.audioCtx.createBufferSource();
          node.buffer = buffer; node.connect(this.audioCtx.destination);
          this.playbackTime = Math.max(this.playbackTime, this.audioCtx.currentTime);
          node.start(this.playbackTime); this.playbackTime += buffer.duration;
        },
        async startMic() {
          if (!this.connected || this.recording) return;
          await this.ensureAudio();
          this.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
          this.source = this.audioCtx.createMediaStreamSource(this.micStream);
          this.processor = this.audioCtx.createScriptProcessor(4096, 1, 1);
          this.source.connect(this.processor); this.processor.connect(this.audioCtx.destination);
          this.recording = true; this.setCaption('user', '我', '正在聆听…');
          this.processor.onaudioprocess = (event) => this.sendPcm16k(event.inputBuffer.getChannelData(0), this.audioCtx.sampleRate);
        },
        stopMicIfRecording() { if (this.recording) this.stopMic(); },
        stopMic() {
          if (this.recording && this.connected && this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          this.processor?.disconnect(); this.source?.disconnect(); this.micStream?.getTracks().forEach((track) => track.stop());
          this.processor = this.source = this.micStream = null; this.recording = false;
          if (this.connected) this.setCaption('user', '我', '正在提交语音…');
        },
        sendPcm16k(input, inRate) {
          if (!this.connected || this.ws?.readyState !== WebSocket.OPEN) return;
          const ratio = inRate / 16000;
          const pcm = new Int16Array(Math.floor(input.length / ratio));
          for (let i = 0; i < pcm.length; i++) { const sample = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)])); pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff; }
          this.ws.send(JSON.stringify({ realtimeInput: { audio: { data: this.b64(new Uint8Array(pcm.buffer)), mimeType: 'audio/pcm;rate=16000' } } }));
        },
        b64(bytes) {
          let binary = '';
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        },
        sendText() {
          const value = this.text.trim();
          if (!this.connected || !value) return;
          this.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: value }] }], turnComplete: true } }));
          this.addMessage('我', value);
          this.setCaption('user', '我', value);
          this.text = '';
        },
      },
    }).mount('#app');
  </script>
</body>
