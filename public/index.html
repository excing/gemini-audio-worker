<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Gemini 语音对话</title>
  <style>
    :root { color-scheme: dark; --bg:#080b13; --panel:rgba(255,255,255,.08); --line:rgba(255,255,255,.14); --text:#f7f8ff; --muted:#aab2c8; --brand:#7c5cff; --ok:#38d996; --warn:#ffca5c; --bad:#ff6b7a; }
    * { box-sizing: border-box; } body { margin:0; height:100dvh; overflow:hidden; display:grid; place-items:center; font:16px/1.5 ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:radial-gradient(circle at 20% 10%,#4530a8 0 18rem,transparent 32rem),radial-gradient(circle at 80% 20%,#0b7b86 0 16rem,transparent 31rem),var(--bg); }
    #app { width:100%; height:100%; } main { width:min(768px,100%); height:100dvh; margin:0 auto; padding:28px; display:grid; gap:18px; grid-template-rows:auto minmax(0,1fr) auto; }
    header, .card, form { border:1px solid var(--line); background:linear-gradient(180deg,rgba(255,255,255,.12),rgba(255,255,255,.06)); box-shadow:0 24px 80px rgba(0,0,0,.35); backdrop-filter:blur(24px); border-radius:28px; }
    header { min-height:68px; padding:10px 14px 10px 22px; display:flex; align-items:center; justify-content:space-between; gap:16px; border-radius:24px; } .titlebar-title { min-width:0; } .role-select { min-width:min(360px,48vw); min-height:48px; font-size:20px; font-weight:750; letter-spacing:-.03em; } .role-select .new-role { color:var(--brand); font-weight:800; } p { margin:.15rem 0 0; color:var(--muted); font-size:14px; } .titlebar-actions { display:flex; align-items:center; gap:10px; } .dot { width:15px; height:15px; border-radius:99px; background:var(--bad); box-shadow:0 0 22px currentColor; } .dot.ok { background:var(--ok); } .dot.wait { background:var(--warn); } .status-dot { position:absolute; top:-3px; right:-3px; border:2px solid rgba(42,35,100,.95); }
    .card { min-height:0; padding:20px; overflow:hidden; position:relative; display:grid; grid-template-rows:minmax(0,1fr); } .view-toggle { position:absolute; top:14px; right:14px; z-index:2; background:rgba(255,255,255,.12); border:1px solid var(--line); } #chat { min-height:0; overflow:auto; padding:4px 56px 4px 4px; display:flex; flex-direction:column; gap:16px; scroll-behavior:smooth; } .group { max-width:82%; display:flex; flex-direction:column; gap:4px; animation:pop .18s ease-out; } .group.user { align-self:flex-end; align-items:flex-end; } .group.ai { align-self:flex-start; align-items:flex-start; } .role { padding:0 6px; font-size:12px; color:rgba(255,255,255,.68); } .msg { padding:10px 14px; border:1px solid var(--line); border-radius:18px; background:rgba(255,255,255,.08); white-space:pre-wrap; } .user .msg { background:linear-gradient(135deg,var(--brand),#23b8d5); } .group .msg + .msg { margin-top:0; } .live { min-height:0; overflow:auto; padding:64px 20px 20px; border-radius:20px; border:1px var(--line); color:var(--text); font-size:clamp(24px,4vw,44px); line-height:1.35; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:14px; text-align:center; white-space:pre-wrap; } .live-role { font-size:14px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; opacity:.8; } .live-body { max-width:100%; } .live-user { color:#56e5ff; } .live-ai { color:#bba9ff; } .live-status { color:var(--warn); } .live-waiting { color:var(--muted); } .wait-icon { display:inline-block; font-size:clamp(48px,10vw,92px); animation:breathe 1.7s ease-in-out infinite; filter:drop-shadow(0 0 28px rgba(255,255,255,.22)); }
    .render-card { display:grid; gap:8px; min-width:min(320px,70vw); max-width:100%; text-align:left; }
    .render-card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .render-card-title { font-weight:750; }
    .render-card-open { min-width:34px; min-height:34px; padding:0; border-radius:12px; font-size:16px; }
    .render-card-preview { overflow:hidden; border:1px solid var(--line); border-radius:12px; background:white; pointer-events:none; }
    .render-card-preview iframe { width:100%; height:420px; border:0; background:white; }
    .render-dialog { width:min(1120px,calc(100% - 24px)); height:min(820px,calc(100dvh - 24px)); }
    .render-modal { height:100%; padding:14px; display:grid; grid-template-rows:auto minmax(0,1fr); gap:12px; }
    .render-modal-head { display:flex; align-items:center; justify-content:space-between; gap:12px; color:var(--muted); }
    .render-modal iframe { width:100%; min-height:100%; border:1px solid var(--line); border-radius:16px; background:white; }
    .render-modal-close { min-width:42px; min-height:42px; padding:0; border-radius:14px; font-size:22px; line-height:1; }
    .system .msg { background:rgba(255,255,255,.06); border-style:dashed; color:rgba(255,255,255,.86); }
    .tool-call-card { display:grid; gap:10px; min-width:min(320px,72vw); max-width:min(560px,76vw); text-align:left; }
    .tool-call-head { display:flex; align-items:center; justify-content:space-between; gap:12px; }
    .tool-call-name { font-size:13px; font-weight:800; color:var(--muted); }
    .tool-call-badge { flex:0 0 auto; min-height:24px; padding:2px 9px; border:1px solid var(--line); border-radius:999px; font-size:12px; font-weight:750; color:var(--muted); background:rgba(255,255,255,.08); display:inline-flex; align-items:center; gap:6px; }
    .tool-call-badge.running { color:var(--warn); }
    .tool-call-badge.done { color:var(--ok); }
    .tool-call-badge.error { color:var(--bad); }
    .tool-call-prompt, .tool-call-text, .tool-call-error { margin:0; white-space:pre-wrap; overflow-wrap:anywhere; }
    .tool-call-prompt { color:var(--text); }
    .tool-call-text { color:var(--muted); }
    .tool-call-error { color:#ffd5da; }
    .tool-call-spinner { display:inline-block; width:16px; height:16px; border:2px solid rgba(255,255,255,.24); border-top-color:var(--warn); border-radius:50%; animation:spin .8s linear infinite; }
    .tool-call-media { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px; }
    .tool-call-image { display:block; width:100%; min-height: auto; object-fit:contain; border:1px solid var(--line); border-radius:12px; background:rgba(0,0,0,.22); }
    form { padding:12px; display:flex; flex-wrap:nowrap; align-items:center; justify-content:space-between; gap:10px; } .input-wrap { flex:1 1 auto; min-width:120px; } .actions { flex:0 0 auto; display:flex; align-items:center; justify-content:space-between; gap:10px; } input, textarea, select { width:100%; min-height:48px; border:1px solid var(--line); border-radius:18px; padding:0 16px; color:var(--text); background:rgba(0,0,0,.25); outline:none; font:inherit; } textarea { min-height:120px; padding:12px 16px; resize:vertical; } button { flex:0 0 auto; min-width:48px; min-height:48px; border:0; border-radius:18px; padding:0 14px; color:white; background:linear-gradient(135deg,var(--brand),#15c8b7); font-size:20px; font-weight:750; cursor:pointer; transition:.2s transform,.2s opacity; } button:hover { transform:translateY(-1px); } button:disabled { opacity:.45; cursor:not-allowed; transform:none; } #mic.recording { background:linear-gradient(135deg,#ff477e,#ff9f43); } #connect { position:relative; } #connect.off { background:linear-gradient(135deg,#ff477e,#ff9f43); } .ghost { background:rgba(255,255,255,.12); border:1px solid var(--line); } .warning { background:var(--bad); border:1px solid var(--line); } dialog { width:min(680px,calc(100% - 24px)); border:1px solid var(--line); border-radius:28px; padding:0; color:var(--text); background:rgba(12,16,28,.96); box-shadow:0 28px 90px rgba(0,0,0,.55); backdrop-filter:blur(24px); } dialog::backdrop { background:rgba(0,0,0,.58); backdrop-filter:blur(6px); } .modal { padding:22px; display:grid; gap:16px; } .modal h2 { margin:0; font-size:24px; } .grid { display:grid; grid-template-columns:1fr 1fr; gap:14px; } label { display:grid; gap:7px; color:var(--muted); font-size:13px; } label.full, .tool-picker.full { grid-column:1/-1; } .modal-actions { display:flex; justify-content: space-between; gap:10px; } .tool-picker { display:grid; gap:10px; color:var(--muted); font-size:13px; } .tool-picker-head { display:flex; align-items:center; justify-content:space-between; gap:12px; } .tool-actions, .tool-list { display:flex; flex-wrap:wrap; gap:8px; align-items:center; } .tool-actions { justify-content:flex-end; } .tool-actions button { min-width:0; min-height:28px; border-radius:999px; padding:0 10px; font-size:12px; } .tool-list { align-items:center; } .tool-chip { min-width:0; min-height:34px; border-radius:999px; padding:0 12px; font-size:13px; } .tool-chip { background:rgba(255,255,255,.1); border:1px solid var(--line); font-weight:650; } .tool-chip.active { background:linear-gradient(135deg,var(--brand),#15c8b7); color:white; } .tool-hint { color:var(--muted); }
    @keyframes pop { from { transform:translateY(6px); opacity:0; } } @keyframes breathe { 0%,100% { transform:scale(.92); opacity:.48; } 50% { transform:scale(1.08); opacity:1; } } @keyframes spin { to { transform:rotate(360deg); } } @media (max-width:700px) { main{padding:12px} header{padding:10px; gap:10px}.titlebar-title p{display:none}.titlebar-actions{gap:8px}.group{max-width:94%}.render-card,.tool-call-card{min-width:0; width:100%; max-width:100%}.grid{grid-template-columns:1fr}.render-card-preview iframe{height:280px}.render-modal{padding:10px}.render-dialog{width:calc(100% - 12px); height:calc(100dvh - 12px)} }
  </style>
</head>
<body>
  <div id="app">
    <main>
      <header>
        <div class="titlebar-title">
          <select class="role-select" v-model="selectedRoleId" @change="selectRole">
            <option class="new-role" value="__new__">＋ 新建角色</option>
            <optgroup label="User" v-if="roles.length > 0">
              <option v-for="role in roles" :key="role.id" :value="role.id">{{ role.name }}</option>
            </optgroup>
            <optgroup label="System">
              <option v-for="role in default_roles" :key="role.id" :value="role.id">{{ role.name }}</option>
            </optgroup>
          </select>
        </div>
        <div class="titlebar-actions">
          <button id="connect" type="button" :title="statusText" :class="{ off: connected }" :disabled="isConnecting" @click="toggleConnection"><span class="dot status-dot" :class="statusKind"></span>{{ connected ? '⏻' : '🔌' }}</button>
          <button class="ghost" type="button" title="配置" @click="openSettings">⚙️</button>
        </div>
      </header>

      <section class="card">
        <button class="view-toggle" type="button" :title="viewMode === 'chat' ? '切换到字幕' : '切换到消息'" @click="toggleViewMode">{{ viewMode === 'chat' ? '💬' : '🗯️' }}</button>
        <div id="chat" ref="chatEl" v-show="viewMode === 'chat'">
          <div v-for="(group, index) in messageGroups" :key="index" class="group" :class="group.role === '我' ? 'user' : (group.role === '系统' ? 'system' : 'ai')">
            <div class="role">{{ group.role }}</div>
            <div v-for="(message, messageIndex) in group.messages" :key="message.id || messageIndex" class="msg">
              <template v-if="message.type === 'renderPage'">
                <div class="render-card">
                  <div class="render-card-head">
                    <span class="render-card-title">{{ message.title }}</span>
                    <button class="ghost render-card-open" type="button" title="放大预览" @click="openRenderedPage(message.renderId)">⛶</button>
                  </div>
                  <div class="render-card-preview" aria-hidden="true">
                    <iframe sandbox="allow-scripts" referrerpolicy="no-referrer" :srcdoc="message.html"></iframe>
                  </div>
                </div>
              </template>
              <template v-else-if="message.type === 'toolCall'">
                <div class="tool-call-card">
                  <div class="tool-call-head">
                    <span class="tool-call-name">{{ toolDisplayName(message.name) }}</span>
                    <span class="tool-call-badge" :class="message.status">
                      <span v-if="message.status === 'running'" class="tool-call-spinner" aria-hidden="true"></span>
                      {{ toolStatusText(message.status) }}
                    </span>
                  </div>
                  <div v-if="message.prompt">
                    <p class="tool-call-prompt">{{ message.prompt }}</p>
                  </div>
                  <div class="tool-call-media" v-if="message.images?.length">
                    <a v-for="(image, imageIndex) in message.images" :key="imageIndex" :href="image.url" target="_blank" rel="noopener noreferrer" title="打开图片">
                      <img class="tool-call-image" :src="image.url" alt="生成图片" />
                    </a>
                  </div>
                  <p class="tool-call-text" v-if="message.text">{{ message.text }}</p>
                  <p class="tool-call-error" v-if="message.error">{{ message.error }}</p>
                </div>
              </template>
              <template v-else>{{ message.text || message }}</template>
            </div>
          </div>
        </div>
        <div class="live" :class="`live-${caption.kind}`" v-show="viewMode === 'caption'">
          <template v-if="caption.kind === 'waiting'">
            <span class="wait-icon" aria-label="等待用户输入">{{ caption.icon }}</span>
          </template>
          <template v-else>
            <div class="live-role">{{ caption.role }}</div>
            <div class="live-body">{{ caption.text }}</div>
          </template>
        </div>
      </section>

      <form @submit.prevent="sendText">
        <button class="ghost" type="button" :title="interactionMode === 'turn' ? '回合模式：AI 完成后自动聆听，AI 回复时自动停麦' : '实时模式：点击麦克风开始/结束录音'" @click="toggleInteractionMode">{{ interactionMode === 'turn' ? '🔁' : '✋' }}</button>
        <div class="input-wrap"><input v-model="text" autocomplete="off" placeholder="输入消息，或使用麦克风实时说话…" /></div>
        <div class="actions">
          <button id="mic" type="button" :title="voiceEnabled ? '关闭用户语音功能' : '开启用户语音功能'" :class="{ recording: voiceEnabled }" :disabled="!canToggleVoice" @click="toggleVoiceEnabled">{{ voiceEnabled ? '🛑' : '🎙️' }}</button>
          <button type="submit" title="发送" :disabled="!canSendText">➤</button>
        </div>
      </form>
    </main>

    <dialog ref="settingsDialog" @click="closeSettingsOnBackdrop">
      <div class="modal">
        <div><h2>会话配置</h2></div>
        <div class="grid">
          <label class="full">角色名<input v-model="draftConfig.roleName" placeholder="例如：中文助理" /></label>
          <label>模型<select v-model="draftConfig.model">
            <option v-for="model in models" :key="model.value" :value="model.value">
              {{ model.name }}
            </option>
          </select></label>
          <label>语音<select v-model="draftConfig.voiceName">
            <option v-for="voice in voices" :key="voice.name" :value="voice.name === 'No Voice' ? '' : voice.name">
              {{ voice.name }} - {{ voice.characteristics }}
            </option>
          </select></label>
          <label>自动加载工具<input v-model="draftConfig.autoLoadTools" placeholder="留空不加载，* 加载全部，或用逗号分隔工具名" /></label>
          <div class="tool-picker full">
            <div class="tool-picker-head">
              <span>工具快捷选择</span>
              <div class="tool-actions">
                <button class="ghost" type="button" :disabled="toolsLoading" @click="refreshToolDeclarations">{{ toolsLoading ? '刷新中' : '刷新' }}</button>
                <button class="ghost" type="button" @click="setAllTools">全部</button>
                <button class="ghost" type="button" @click="clearTools">清空</button>
              </div>
            </div>
            <div class="tool-list-wrap">
              <div class="tool-list" v-if="toolDeclarations.length">
                <button
                  v-for="tool in toolDeclarations"
                  :key="tool.name"
                  class="tool-chip"
                  :class="{ active: isToolSelected(tool.name) }"
                  :title="tool.description || tool.name"
                  type="button"
                  @click="toggleTool(tool.name)"
                >{{ tool.name }}</button>
              </div>
              <span class="tool-hint" v-else>暂无可用工具</span>
            </div>
          </div>
          <label class="full">系统提示词<textarea v-model="draftConfig.systemInstruction"></textarea></label>
        </div>
        <div class="modal-actions">
          <button v-if="canDeleteRole" class="warning" type="button" @click="deleteRole">删除</button>
          <div style="flex: 1"></div>
          <button class="ghost" type="button" @click="closeSettings">取消</button>
          <button type="button" @click="saveSettings">保存</button>
        </div>
      </div>
    </dialog>

    <dialog class="render-dialog" ref="renderDialog" @click="closeRenderedPageOnBackdrop">
      <div class="render-modal">
        <div class="render-modal-head">
          <strong>{{ activeRenderPage?.title || '页面渲染' }}</strong>
          <button class="ghost render-modal-close" type="button" title="关闭预览" @click="closeRenderedPage">×</button>
        </div>
        <iframe v-if="activeRenderPage" title="工具渲染页面预览" sandbox="allow-scripts" referrerpolicy="no-referrer" :srcdoc="activeRenderPage.html"></iframe>
      </div>
    </dialog>
  </div>

  <script src="./constant.js"></script>
  <script src="./tools.js"></script>
  <script src="https://unpkg.com/vue@3.5.34/dist/vue.global.prod.js"></script>
  <script>
    const { createApp, nextTick } = Vue;

    const models = window.APP_MODELS || [];
    const voices = window.APP_VOICES || [];

    const default_roles = window.DEFAULT_ROLES || [];
    const browserTools = window.BROWSER_TOOLS || { declarations: [], handlers: {} };

    const TOOL_CACHE_KEY = 'geminiToolDeclarations';

    createApp({
      data() {
        const defaultConfig = {
          roleName: 'Gemini 语音对话',
          model: 'gemini-3.1-flash-preview',
          voiceName: 'Kore',
          systemInstruction: 'You are a concise, friendly Chinese voice assistant.',
          autoLoadTools: '',
        };
        return {
          defaultConfig,
          models,
          voices,
          roles: [],
          default_roles: default_roles.map((role) => this.normalizeRole(role)),
          selectedRoleId: '',
          config: defaultConfig,
          draftConfig: { ...defaultConfig },
          ws: null,
          audioCtx: null,
          playbackTime: 0,
          audioNodes: [],
          audioGeneration: 0,
          captionTimers: [],
          pendingAiCaption: '',
          aiAudioScheduledThisTurn: false,
          micStream: null,
          source: null,
          processor: null,
          connected: false,
          micStatus: 'idle',
          statusText: '未连接',
          statusKind: '',
          caption: { kind: 'status', role: '状态', text: '点击 🔌 开始', icon: '💭' },
          viewMode: 'caption',
          interactionMode: localStorage.getItem('geminiInteractionMode') || 'manual',
          voiceEnabled: JSON.parse(localStorage.getItem('geminiVoiceEnabled') || 'false'),
          text: '',
          messageGroups: [],
          renderedPages: [],
          activeRenderPageId: '',
          inputDraft: '',
          outputDraft: '',
          toolDeclarations: this.loadCachedToolDeclarations(),
          toolsLoading: false,
        };
      },
      mounted() {
        this.roles = this.loadRoles();
        this.selectedRoleId = localStorage.getItem('geminiSelectedRoleId') || this.roles[0]?.id || this.default_roles[0]?.id || '';
        this.config = this.loadConfig();
        this.draftConfig = { ...this.config };
        window.addEventListener('browser-tool-render-page', this.handleRenderedPage);
        this.loadToolDeclarations();
      },
      beforeUnmount() {
        window.removeEventListener('browser-tool-render-page', this.handleRenderedPage);
      },
      computed: {
        activeRenderPage() {
          return this.renderedPages.find((page) => page.id === this.activeRenderPageId) || null;
        },
        canDeleteRole() {
          return !!this.selectedRoleId && this.selectedRoleId !== '__new__' && !default_roles.some((role) => role.id === this.selectedRoleId);
        },
        isConnecting() {
          return !this.connected && this.statusKind === 'wait';
        },
        isSessionReady() {
          return this.connected && this.statusKind === 'ok';
        },
        canToggleVoice() {
          return this.isSessionReady && this.micStatus !== 'starting';
        },
        canSendText() {
          return this.isSessionReady && !!this.text.trim();
        },
      },
      methods: {
        createDefaultRole() {
          return { ...this.defaultConfig, id: `role-${Date.now()}`, roleName: this.defaultConfig.roleName };
        },
        normalizeRole(role) {
          const normalized = { ...this.defaultConfig, ...role };
          normalized.id ||= `role-${Date.now()}`;
          normalized.roleName = (normalized.roleName || normalized.name || this.defaultConfig.roleName).trim();
          normalized.name = normalized.roleName;
          return normalized;
        },
        loadRoles() {
          try {
            const roles = JSON.parse(localStorage.getItem('geminiRoles') || '[]').map((role) => this.normalizeRole(role));
            if (roles.length) return roles;
          } catch {}
          return [];
        },
        saveRoles() { localStorage.setItem('geminiRoles', JSON.stringify(this.roles)); },
        loadConfig() {
          return { ...this.defaultConfig, ...([...this.roles, ...this.default_roles].find((role) => role.id === this.selectedRoleId) || this.roles[0] || {}) };
        },
        loadCachedToolDeclarations() {
          try {
            const cachedTools = JSON.parse(localStorage.getItem(TOOL_CACHE_KEY) || '[]');
            return this.mergeToolDeclarations(browserTools.declarations, Array.isArray(cachedTools) ? cachedTools : []);
          } catch {
            return this.mergeToolDeclarations(browserTools.declarations);
          }
        },
        mergeToolDeclarations(...toolGroups) {
          const toolMap = new Map();
          toolGroups.flat().filter(Boolean).forEach((tool) => {
            if (tool?.name && !toolMap.has(tool.name)) toolMap.set(tool.name, tool);
          });
          return [...toolMap.values()];
        },
        async loadToolDeclarations({ force = false } = {}) {
          if (this.toolsLoading) return;
          this.toolsLoading = true;
          try {
            const response = await fetch('/api/tools');
            const data = await response.json();
            if (Array.isArray(data.tools)) {
              this.toolDeclarations = this.mergeToolDeclarations(browserTools.declarations, data.tools);
              localStorage.setItem(TOOL_CACHE_KEY, JSON.stringify(this.toolDeclarations));
            }
            if (data.error) console.warn('Load MCP tools failed:', data.error);
          } catch (error) {
            console.warn('Load tools failed:', error);
          } finally {
            this.toolsLoading = false;
          }
        },
        refreshToolDeclarations() { this.loadToolDeclarations(); },
        selectedToolNames() {
          const value = (this.draftConfig.autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return this.toolDeclarations.map((tool) => tool.name);
          return value.split(',').map((name) => name.trim()).filter(Boolean);
        },
        updateSelectedTools(names) {
          const uniqueNames = names.filter((name, index) => name && names.indexOf(name) === index);
          this.draftConfig.autoLoadTools = uniqueNames.join(',');
        },
        isToolSelected(name) { return this.selectedToolNames().includes(name); },
        toggleTool(name) {
          const names = this.selectedToolNames();
          this.updateSelectedTools(names.includes(name) ? names.filter((item) => item !== name) : [...names, name]);
        },
        setAllTools() { this.draftConfig.autoLoadTools = '*'; },
        clearTools() { this.draftConfig.autoLoadTools = ''; },
        saveSettings() {
          const isSystemRole = default_roles.some((role) => role.id === this.selectedRoleId);
          const sourceRole = [...this.roles, ...default_roles].find((role) => role.id === this.selectedRoleId) || this.defaultConfig;
          const baseRoleName = (this.draftConfig.roleName || sourceRole.roleName || this.defaultConfig.roleName || '').trim() || '未命名角色';
          const roleName = isSystemRole && !baseRoleName.includes('自定义')
            ? `${baseRoleName}（自定义）`
            : baseRoleName;
          const roleId = isSystemRole ? `role-${Date.now()}` : (this.selectedRoleId || `role-${Date.now()}`);
          const role = this.normalizeRole({ ...this.draftConfig, id: roleId, roleName });
          const index = this.roles.findIndex((item) => item.id === role.id);
          if (index >= 0) this.roles.splice(index, 1, role);
          else this.roles.push(role);
          this.selectedRoleId = role.id;
          this.config = { ...role };
          this.saveRoles();
          localStorage.setItem('geminiSelectedRoleId', this.selectedRoleId);
          this.closeSettings();
          this.setCaption('status', '状态', `角色「${role.roleName}」已保存，下次连接时生效。`);
        },
        deleteRole() {
          if (!this.canDeleteRole) return;
          const index = this.roles.findIndex((role) => role.id === this.selectedRoleId);
          if (index < 0) return;
          const [deletedRole] = this.roles.splice(index, 1);
          const nextRole = this.roles[0] || default_roles[0] || null;
          this.selectedRoleId = nextRole?.id || '';
          this.config = this.loadConfig();
          this.draftConfig = { ...this.config };
          this.saveRoles();
          if (this.selectedRoleId) localStorage.setItem('geminiSelectedRoleId', this.selectedRoleId);
          else localStorage.removeItem('geminiSelectedRoleId');
          this.closeSettings();
          this.setCaption('status', '状态', `角色「${deletedRole.roleName}」已删除。`);
        },
        openSettings() { this.draftConfig = { ...this.loadConfig() }; this.$refs.settingsDialog.showModal(); },
        selectRole() {
          if (this.selectedRoleId === '__new__') {
            this.draftConfig = this.createDefaultRole();
            this.selectedRoleId = '';
            this.$refs.settingsDialog.showModal();
            return;
          }
          localStorage.setItem('geminiSelectedRoleId', this.selectedRoleId);
          this.config = this.loadConfig();
          this.draftConfig = { ...this.config };
          this.setCaption('status', '状态', `已切换到角色「${this.config.roleName}」。`);
        },
        closeSettings() { this.$refs.settingsDialog.close(); },
        closeSettingsOnBackdrop(event) { if (event.target === this.$refs.settingsDialog) this.closeSettings(); },
        setStatus(text, kind = '') { this.statusText = text; this.statusKind = kind; },
        setCaption(kind, role = '', text = '', icon = '💭') { this.caption = { kind, role, text: text.trim(), icon }; },
        showWaitingForUser() { this.setCaption('waiting', '', '', '💭'); },
        clearCaptionTimers() {
          this.captionTimers.forEach((timer) => clearTimeout(timer));
          this.captionTimers = [];
        },
        interruptAiPlayback() {
          this.audioGeneration += 1;
          this.clearCaptionTimers();
          this.pendingAiCaption = '';
          this.aiAudioScheduledThisTurn = false;
          this.audioNodes.forEach((node) => { try { node.stop(); } catch {} });
          this.audioNodes = [];
          if (this.audioCtx) this.playbackTime = this.audioCtx.currentTime;
        },
        scheduleCaptionAt(kind, role, text, audioTime, icon = '💭', generation = this.audioGeneration) {
          const delay = Math.max(0, ((audioTime || this.audioCtx?.currentTime || 0) - (this.audioCtx?.currentTime || 0)) * 1000);
          const timer = setTimeout(() => {
            if (generation === this.audioGeneration) this.setCaption(kind, role, text, icon);
          }, delay);
          this.captionTimers.push(timer);
        },
        scheduleWaitingAfterAudio() {
          const audioTime = Math.max(this.playbackTime, this.audioCtx?.currentTime || 0) + 0.1;
          this.scheduleCaptionAt('waiting', '', '', audioTime, '💭');
        },
        scheduleTurnMicAfterAudio() {
          if (this.interactionMode !== 'turn' || !this.voiceEnabled) return;
          const audioTime = Math.max(this.playbackTime, this.audioCtx?.currentTime || 0) + 0.15;
          this.scheduleCaptionAt('waiting', '', '', audioTime, '🎙️');
          const delay = Math.max(0, (audioTime - (this.audioCtx?.currentTime || 0)) * 1000);
          const timer = setTimeout(() => this.startMic({ interruptAi: false }), delay);
          this.captionTimers.push(timer);
        },
        toggleViewMode() { this.viewMode = this.viewMode === 'chat' ? 'caption' : 'chat'; },
        toggleInteractionMode() {
          this.interactionMode = this.interactionMode === 'turn' ? 'manual' : 'turn';
          localStorage.setItem('geminiInteractionMode', this.interactionMode);
          this.setCaption('status', '状态', this.interactionMode === 'turn'
            ? (this.voiceEnabled ? '已开启回合模式。AI 完成后会自动聆听。' : '已开启回合模式，但用户语音未开启。当前仅支持文字输入。')
            : (this.voiceEnabled ? '已切换到实时模式。用户语音将保持开启。' : '已切换到实时模式。当前仅支持文字输入。'));
          if (this.voiceEnabled && this.interactionMode === 'turn' && this.isSessionReady && this.micStatus === 'idle' && !this.audioNodes.length) this.startMic({ interruptAi: false });
        },
        toggleVoiceEnabled() {
          this.voiceEnabled = !this.voiceEnabled;
          localStorage.setItem('geminiVoiceEnabled', JSON.stringify(this.voiceEnabled));
          if (!this.voiceEnabled) {
            this.stopMic();
            this.interruptAiPlayback();
            this.setCaption('status', '状态', '已关闭用户语音功能。现在仅支持文字输入。');
            return;
          }
          this.setCaption('status', '状态', this.interactionMode === 'turn'
            ? '已开启用户语音功能，正在进入回合模式。'
            : '已开启用户语音功能，正在进入实时模式。');
          if (this.isSessionReady && this.micStatus === 'idle' && !this.audioNodes.length) this.startMic({ interruptAi: this.interactionMode === 'manual' });
        },
        setupMessage() {
          const setup = {
            model: this.config.model,
            generationConfig: { },
            systemInstruction: { parts: [{ text: this.config.systemInstruction }] },
          };
          if (this.config.voiceName) setup.generationConfig.speechConfig = { voiceConfig: { prebuiltVoiceConfig: { voiceName: this.config.voiceName } } };
          setup.autoLoadTools = this.config.autoLoadTools || '';
          const browserToolNames = this.selectedBrowserToolNames(setup.autoLoadTools);
          const browserToolDeclarations = browserTools.declarations.filter((tool) => browserToolNames.includes(tool.name));
          if (browserToolDeclarations.length) setup.tools = [{ functionDeclarations: browserToolDeclarations }];
          return { setup };
        },
        selectedBrowserToolNames(autoLoadTools) {
          const browserToolNames = browserTools.declarations.map((tool) => tool.name);
          const value = (autoLoadTools || '').trim();
          if (!value) return [];
          if (value === '*') return browserToolNames;
          const selectedNames = value.split(',').map((name) => name.trim()).filter(Boolean);
          return browserToolNames.filter((name) => selectedNames.includes(name));
        },
        async handleBrowserToolCalls(functionCalls) {
          const functionResponses = [];
          for (const call of functionCalls) {
            const handler = browserTools.handlers?.[call.name];
            let response;
            if (!handler) {
              response = { error: `Unknown browser tool: ${call.name}` };
            } else {
              try {
                response = await handler(call.args || {});
              } catch (error) {
                response = { error: error.message || String(error) };
              }
            }
            functionResponses.push({ id: call.id, name: call.name, response });
          }
          if (this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ toolResponse: { functionResponses } }));
        },
        handleRenderedPage(event) {
          const page = {
            id: event.detail?.id || `render-${Date.now()}`,
            title: event.detail?.title || '页面渲染',
            html: String(event.detail?.html || ''),
          };
          this.renderedPages.push(page);
          this.addMessage('Gemini', {
            id: page.id,
            type: 'renderPage',
            renderId: page.id,
            title: page.title,
            html: page.html,
          });
          this.openRenderedPage(page.id);
        },
        openRenderedPage(renderId) {
          this.activeRenderPageId = renderId;
          nextTick(() => {
            if (!this.$refs.renderDialog.open) this.$refs.renderDialog.showModal();
          });
        },
        closeRenderedPage() {
          this.$refs.renderDialog.close();
        },
        closeRenderedPageOnBackdrop(event) {
          if (event.target === this.$refs.renderDialog) this.closeRenderedPage();
        },
        toggleConnection() { this.connected ? this.ws?.close(1000, 'User disconnected') : this.connect(); },
        async connect() {
          if (this.connected || this.isConnecting) return;
          this.config = this.loadConfig();
          this.ws = new WebSocket(`${location.protocol === 'https:' ? 'wss' : 'ws'}://${location.host}/ws`);
          this.interruptAiPlayback();
          this.setStatus('连接中…', 'wait');
          this.ws.onopen = async () => { this.connected = true; await this.ensureAudio(); this.setStatus('初始化…', 'wait'); this.setCaption('status', '状态', '正在初始化 Gemini Live 会话…'); };
          this.ws.onmessage = (event) => this.handleMessage(JSON.parse(event.data));
          this.ws.onerror = () => this.setStatus('连接错误');
          this.ws.onclose = (event) => { this.interruptAiPlayback(); this.stopMic(); this.connected = false; this.setStatus('已断开'); this.setCaption('status', '状态', event.code == 1000 ? '已关闭' : `连接关闭 code=${event.code || 'unknown'} reason=${event.reason || '无'}`); };
        },
        handleMessage(msg) {
          if (msg.systemContent) {
            this.handleSystemContent(msg.systemContent);
            return;
          }
          if (msg.workerStatus) {
            if (msg.workerStatus.type === 'gemini_close') this.ws?.close(1000, 'User disconnected');
            if (msg.workerStatus.type === 'gemini_open') this.ws.send(JSON.stringify(this.setupMessage()));
            return;
          }
          if (msg.setupComplete) {
            this.setStatus('已连接', 'ok');
            this.showWaitingForUser();
            if (this.voiceEnabled) this.startMic({ interruptAi: false });
            return;
          }
          const browserFunctionCalls = (msg.toolCall?.functionCalls || []).filter((call) => browserTools.handlers?.[call.name]);
          if (browserFunctionCalls.length) {
            this.handleBrowserToolCalls(browserFunctionCalls);
            return;
          }
          const content = msg.serverContent;
          if (!content) return;
          if (content.interrupted) {
            this.interruptAiPlayback();
            this.aiAudioScheduledThisTurn = false;
            if (this.interactionMode === 'turn' && this.voiceEnabled) this.scheduleTurnMicAfterAudio();
            else this.scheduleWaitingAfterAudio();
            return;
          }
          if (content.inputTranscription?.text) { this.setCaption('user', '我', `${this.inputDraft}${content.inputTranscription.text}`); this.addTranscript('我', content.inputTranscription.text); }
          const aiStarted = !!(content.outputTranscription?.text || content.modelTurn?.parts?.length);
          if (aiStarted && this.interactionMode === 'turn' && this.voiceEnabled && this.micStatus === 'recording') this.stopMic({ sendEnd: false });
          if (content.outputTranscription?.text) {
            this.pendingAiCaption = `${this.outputDraft}${content.outputTranscription.text}`;
            this.addTranscript('Gemini', content.outputTranscription.text);
          }
          for (const part of content.modelTurn?.parts || []) {
            if (part.text) {
              this.pendingAiCaption = `${this.outputDraft}${part.text}`;
              this.addTranscript('Gemini', part.text);
            }
            if (part.inlineData?.data) {
              this.aiAudioScheduledThisTurn = true;
              this.playPcm(part.inlineData.data, part.inlineData.mimeType, this.pendingAiCaption);
            }
          }
          if (content.turnComplete) {
            const textOnlyAiCaption = !this.aiAudioScheduledThisTurn && this.pendingAiCaption;
            this.addTranscript('我', '', true);
            this.addTranscript('Gemini', '', true);
            if (textOnlyAiCaption) this.setCaption('ai', 'Gemini', textOnlyAiCaption);
            this.pendingAiCaption = '';
            this.aiAudioScheduledThisTurn = false;
            if (this.voiceEnabled && this.interactionMode === 'turn') this.scheduleTurnMicAfterAudio();
            else if (!textOnlyAiCaption) this.scheduleWaitingAfterAudio();
          }
        },
        handleSystemContent(systemContent) {
          const toolCall = systemContent?.toolCall;
          if (!toolCall) return;

          const id = toolCall.id || `tool-call-${Date.now()}`;
          const existing = this.findToolCallMessage(id);
          const result = toolCall.result || null;
          const images = (Array.isArray(result?.images) ? result.images : [])
            .map((image) => this.normalizeGeneratedImage(image))
            .filter(Boolean);
          const nextMessage = {
            ...(existing?.message || {}),
            id,
            type: 'toolCall',
            name: toolCall.name || existing?.message?.name || 'tool',
            status: toolCall.error ? 'error' : (result ? 'done' : 'running'),
            prompt: typeof toolCall.prompt === 'string' ? toolCall.prompt.trim() : (existing?.message?.prompt || ''),
            images,
            text: String(result?.text || '').trim(),
            error: toolCall.error ? String(toolCall.error) : '',
          };

          if (existing) existing.group.messages.splice(existing.messageIndex, 1, nextMessage);
          else this.addMessage('系统', nextMessage);

          if (this.viewMode !== 'chat') this.viewMode = 'chat';
          if (nextMessage.status === 'running') this.setCaption('status', '状态', `正在调用${this.toolDisplayName(nextMessage.name)}…`);
          else if (nextMessage.status === 'error') this.setCaption('status', '状态', `${this.toolDisplayName(nextMessage.name)}失败：${nextMessage.error}`);
          else this.setCaption('status', '状态', `${this.toolDisplayName(nextMessage.name)}完成${images.length ? `，共 ${images.length} 张图片` : ''}。`);

          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
        },
        findToolCallMessage(id) {
          for (let groupIndex = this.messageGroups.length - 1; groupIndex >= 0; groupIndex -= 1) {
            const group = this.messageGroups[groupIndex];
            if (group.role !== '系统') continue;
            const messageIndex = group.messages.findIndex((message) => message?.type === 'toolCall' && message.id === id);
            if (messageIndex >= 0) return { group, messageIndex, message: group.messages[messageIndex] };
          }
          return null;
        },
        normalizeGeneratedImage(image) {
          if (!image) return null;
          if (typeof image === 'string') return { url: image };
          if (image.url) return { url: image.url };
          if (image.b64_json) return { url: `data:image/png;base64,${image.b64_json}` };
          return null;
        },
        toolDisplayName(name) {
          if (name === 'imageGeneration') return '图片生成';
          return name || '工具调用';
        },
        toolStatusText(status) {
          if (status === 'done') return '完成';
          if (status === 'error') return '失败';
          return '进行中';
        },
        addTranscript(role, text, flush = false) {
          const draftKey = role === '我' ? 'inputDraft' : 'outputDraft';
          const draft = this[draftKey] + text;
          const parts = draft.match(/[^。！？!?；;\n]+[。！？!?；;\n]+|[^。！？!?；;\n]+$/g) || [];
          const pending = !flush && parts.length && !/[。！？!?；;\n]$/.test(parts.at(-1)) ? parts.pop() : '';
          parts.forEach((part) => this.addMessage(role, part.trim()));
          this[draftKey] = pending;
        },
        addMessage(role, text) {
          const message = typeof text === 'string' ? { type: 'text', text: text.trim() } : text;
          if (!message || (message.type === 'text' && !message.text)) return;
          const lastGroup = this.messageGroups.at(-1);
          if (lastGroup?.role === role) lastGroup.messages.push(message);
          else this.messageGroups.push({ role, messages: [message] });
          nextTick(() => { this.$refs.chatEl.scrollTop = this.$refs.chatEl.scrollHeight; });
        },
        async ensureAudio() {
          this.audioCtx ||= new AudioContext();
          if (this.audioCtx.state !== 'running') await this.audioCtx.resume();
          this.playbackTime = Math.max(this.playbackTime, this.audioCtx.currentTime);
        },
        async playPcm(data, mime = 'audio/pcm;rate=24000', captionText = '') {
          const generation = this.audioGeneration;
          await this.ensureAudio();
          if (generation !== this.audioGeneration) return;
          const rate = +(mime.match(/rate=(\d+)/)?.[1] || 24000);
          const raw = atob(data);
          const samples = raw.length / 2;
          const buffer = this.audioCtx.createBuffer(1, samples, rate);
          const out = buffer.getChannelData(0);
          for (let i = 0; i < samples; i++) { const lo = raw.charCodeAt(i * 2), hi = raw.charCodeAt(i * 2 + 1); let value = (hi << 8) | lo; if (value & 0x8000) value -= 0x10000; out[i] = value / 32768; }
          const node = this.audioCtx.createBufferSource();
          node.buffer = buffer; node.connect(this.audioCtx.destination);
          this.playbackTime = Math.max(this.playbackTime, this.audioCtx.currentTime);
          const startTime = this.playbackTime;
          if (captionText) this.scheduleCaptionAt('ai', 'Gemini', captionText, startTime, '💭', generation);
          node.onended = () => { this.audioNodes = this.audioNodes.filter((item) => item !== node); };
          this.audioNodes.push(node);
          node.start(startTime); this.playbackTime += buffer.duration;
        },
        async startMic(options = {}) {
          const { interruptAi = true } = options;
          if (!this.isSessionReady || !this.voiceEnabled || this.micStatus !== 'idle') return;
          this.micStatus = 'starting';
          const playCue = new Audio('/speech_start.mp3');
          try { await playCue.play(); } catch {}
          try {
            if (interruptAi) this.interruptAiPlayback();
            await this.ensureAudio();
            this.micStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
            this.source = this.audioCtx.createMediaStreamSource(this.micStream);
            this.processor = this.audioCtx.createScriptProcessor(4096, 1, 1);
            this.source.connect(this.processor); this.processor.connect(this.audioCtx.destination);
            this.micStatus = 'recording'; this.setCaption('user', '我', '正在聆听…');
            this.processor.onaudioprocess = (event) => this.sendPcm16k(event.inputBuffer.getChannelData(0), this.audioCtx.sampleRate);
          } catch (error) {
            this.stopMic();
            this.setCaption('status', '状态', `无法开始录音：${error.message || error}`);
          }
        },
        stopMic(options = {}) {
          const { sendEnd = true } = options;
          const wasRecording = this.micStatus === 'recording';
          if (sendEnd && wasRecording && this.connected && this.ws?.readyState === WebSocket.OPEN) this.ws.send(JSON.stringify({ realtimeInput: { audioStreamEnd: true } }));
          this.processor?.disconnect(); this.source?.disconnect(); this.micStream?.getTracks().forEach((track) => track.stop());
          this.processor = this.source = this.micStream = null; this.micStatus = 'idle';
        },
        sendPcm16k(input, inRate) {
          if (!this.isSessionReady || this.ws?.readyState !== WebSocket.OPEN) return;
          const ratio = inRate / 16000;
          const pcm = new Int16Array(Math.floor(input.length / ratio));
          for (let i = 0; i < pcm.length; i++) { const sample = Math.max(-1, Math.min(1, input[Math.floor(i * ratio)])); pcm[i] = sample < 0 ? sample * 0x8000 : sample * 0x7fff; }
          this.ws.send(JSON.stringify({ realtimeInput: { audio: { data: this.b64(new Uint8Array(pcm.buffer)), mimeType: 'audio/pcm;rate=16000' } } }));
        },
        b64(bytes) {
          let binary = '';
          for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
          return btoa(binary);
        },
        sendText() {
          const value = this.text.trim();
          if (!this.canSendText) return;
          this.interruptAiPlayback();
          this.ws.send(JSON.stringify({ clientContent: { turns: [{ role: 'user', parts: [{ text: value }] }], turnComplete: true } }));
          this.addMessage('我', value);
          this.setCaption('user', '我', value);
          this.text = '';
        },
      },
    }).mount('#app');
  </script>
</body>
</html>
